mechanical:
  transmissions:
    - id: drivetrain
      type: differential
      actuator: motor
      joints: [spin_rl, spin_rr]
      ratio: 9.066         # 18T pinion / 66T spur x 2.4727 internal (pinion swap from 17T: 9.6 -> 9.066 for top-speed margin)
      efficiency: 0.88
      path: [motor_pinion, output_l, output_r, wheel_drive_rl, wheel_drive_rr]
    - id: steering
      type: ackermann_steering
      actuator: servo
      joints: [steer_fl, steer_fr]
      ratio: 0.85           # wheel angle per horn angle near full lock; the CAD steering table supersedes it
      params: {wheelbase: 260 mm, kingpin_track: 135 mm, max_steer: 0.45, servo_travel: 30 deg}
      path: [servo_output, horn_spline, bs_hl, bj_hl, bj_kl, bs_kl, bs_hr, bj_hr, bj_kr, bs_kr]
  # Sensing only (not an attachment): checked on exact geometry, axis in the encoder frame (sensor face, facing the ring).
  interfaces:
    - {id: enc_target, kind: magnetic_target, parts: [enc_ring, encoder], frame: encoder, axis_point: [0, 0, 20 mm], axis_dir: [0, 0, 1],
       params: {magnets: [enc_magnet_1, enc_magnet_2, enc_magnet_3, enc_magnet_4], gap: [0.5 mm, 2.0 mm]}}

electrical:
  ground_net: GND
  direct_mates:
    - {a: hat.J_GPIO, b: pi.J8}
    - a: front_camera.J1
      b: camera_fpc.A
    - a: camera_fpc.B
      b: pi.CAM0
  harnesses:
    - id: battery_lead
      description: Battery 12 AWG pigtail reterminated with XT90H female (45 A continuous / 90 A burst).
      connectors:
        A: {type: integral, mates: battery.J1}
        B: {type: xt90h-female, position: [228 mm, 27 mm, 60 mm]}
      wires:
        - {id: W_BAT_P, from: A.1, to: B.1, awg: 12, color: red, signal: VBAT}
        - {id: W_BAT_N, from: A.2, to: B.2, awg: 12, color: black, signal: GND}
      route: {slack: 20 mm}
    - id: power_y
      # Gauges from the installed (bundle- and enclosure-derated) ampacity of the wiring stage: the HAT branch is 14 AWG
      # (13.44 A installed in the current layout); a 7.5 A fuse also supplies the owned camera; the
      # fuse holder's input pigtail is 12 AWG like the trunk, so no thinner conductor sits upstream of the fuse.
      description: XT90H battery input splitting to the XT60 ESC branch (12 AWG) and, through a 7.5 A fuse, the XT30 HAT branch (14 AWG).
      connectors:
        P1: {type: xt90h-male, mates: battery_lead.B}
        P2: {type: xt60-female}
        P3: {type: xt30-female, mates: hat.J_BATT}
        F1: {type: integral, mates: fuse.J1}
        F2: {type: integral, mates: fuse.J2}
      splices:
        # SP is 28 mm beyond the fuse input: its 18 AWG strain-relief run ends before the splice.
        # The 12 AWG branches split in the open corner ahead of the battery.
        SP: {position: [199 mm, -37 mm, 40 mm]}
        SN: {position: [199 mm, -30 mm, 54 mm]}
      wires:
        - {id: W_Y_P_IN, from: P1.1, to: SP, awg: 12, color: red, signal: VBAT}
        - {id: W_Y_P_ESC, from: SP, to: P2.1, awg: 12, color: red, signal: VBAT}
        - {id: W_Y_P_FUSE, from: SP, to: F1.1, awg: 12, color: red, signal: VBAT}
        - {id: W_Y_P_HAT, from: F2.1, to: P3.1, awg: 14, color: red, signal: VBAT_FUSED}
        - {id: W_Y_N_IN, from: P1.2, to: SN, awg: 12, color: black, signal: GND}
        - {id: W_Y_N_ESC, from: SN, to: P2.2, awg: 12, color: black, signal: GND}
        - {id: W_Y_N_HAT, from: SN, to: P3.2, awg: 14, color: black, signal: GND}
      route: {slack: 25 mm, keep_away: [motor, gearbox]}
    - id: esc_power
      connectors:
        A: {type: integral, mates: esc.J_PWR}
        # The mated XT60 pair stays beside the battery ahead of the ESC, clear of the front wheels' steering sweep.
        B: {type: xt60-male, mates: power_y.P2, position: [180 mm, 40 mm, 60 mm]}
      wires:
        - {id: W_ESC_P, from: A.1, to: B.1, awg: 12, color: red, signal: VBAT}
        - {id: W_ESC_N, from: A.2, to: B.2, awg: 12, color: black, signal: GND}
      route: {slack: 20 mm}
    - id: esc_motor
      description: Individually routed 18 AWG silicone motor lead, directly soldered to motor tab.
      connectors:
        A: {type: integral, mates: esc.J_MOT_B}
        BN: {type: integral, mates: motor.J_NEG}
      wires:
        # Electrical: 58.81 A for 2 s reaches 45.24 C; continuous operating points pass the installed ampacity.
        - {id: W_MOT_B, from: A.1, to: BN.1, awg: 18, color: yellow, signal: MOTOR_B}
      route: {slack: 15 mm, keep_away: [wheel_rl, wheel_rr, gearbox]}
    - id: esc_motor_upper
      description: Individually routed 18 AWG silicone motor lead, directly soldered to motor tab.
      connectors:
        A: {type: integral, mates: esc.J_MOT_A}
        BP: {type: integral, mates: motor.J_POS}
      wires:
        - {id: W_MOT_A, from: A.1, to: BP.1, awg: 18, color: blue, signal: MOTOR_A}
      route: {slack: 15 mm, keep_away: [wheel_rl, wheel_rr, gearbox]}
    - id: esc_signal
      connectors:
        A: {type: integral, mates: esc.J_SIG}
        B: {type: servo-3-female, mates: hat.J_ESC}
      wires:
        # J_ESC on the HAT is the ESC side of a digital isolator: the lead's ground (A.3) is referenced only to the
        # isolator's ESC side (not HAT GND), so motor return current cannot share it; the ESC's BEC (A.2) powers that
        # side (a few mA). The servo runs from the HAT's 6.0 V buck-boost, never from the BEC.
        - {id: W_ESC_SIG, from: A.1, to: B.1, awg: 22, color: white, signal: ESC_PWM}
        - {id: W_ESC_BEC, from: A.2, to: B.2, awg: 22, color: red, signal: ESC_BEC}
        - {id: W_ESC_GND, from: A.3, to: B.3, awg: 22, color: black, signal: ESC_GND}
      route: {slack: 30 mm}
    - id: servo_lead
      connectors:
        A: {type: integral, mates: servo.J1}
        B: {type: servo-3-female-hd, mates: hat.J_SERVO}
      wires:
        # Power pair 20 AWG (servo re-leaded, heavy-duty JR plug): 22 AWG dropped 3.1 % at servo stall (3 % limit).
        - {id: W_SRV_SIG, from: A.1, to: B.1, awg: 22, color: white, signal: SERVO_PWM}
        - {id: W_SRV_VCC, from: A.2, to: B.2, awg: 20, color: red, signal: SERVO_6V}
        - {id: W_SRV_GND, from: A.3, to: B.3, awg: 20, color: black, signal: GND}
      # The forward shelf restrains the pigtail turn; collared posts carry the climb outside the deck
      # and above the receiver to the HAT's south-facing connector.
      route: {keep_away: [wheel_fl, wheel_fr, knuckle_fl, knuckle_fr], slack: 30 mm, tie_points: [[325 mm, -10 mm, 41.87 mm], [185.21 mm, -49.21 mm, 62 mm], [135 mm, -79.347 mm, 113 mm], [85.5 mm, -100 mm, 128 mm], [159.6546 mm, -67.412733 mm, 84.586 mm], [117.4532 mm, -104.542333 mm, 135.4386 mm]], via: [[320 mm, -30 mm, 42 mm], [170 mm, -63 mm, 85 mm], [110 mm, -100 mm, 140 mm]]}
    - id: rx_lead
      connectors:
        A: {type: integral, mates: receiver.J1}
        B: {type: jst-gh-4-housing, mates: hat.J_RX}
      wires:
        - {id: W_RX_5V, from: A.1, to: B.1, awg: 28, color: red, signal: 5V}
        - {id: W_RX_PI_TX, from: A.3, to: B.2, awg: 28, color: white, signal: CRSF_TX}
        - {id: W_RX_PI_RX, from: A.2, to: B.3, awg: 28, color: green, signal: CRSF_RX}
        - {id: W_RX_GND, from: A.4, to: B.4, awg: 28, color: black, signal: GND}
      route: {slack: 20 mm}
    - id: gps_lead
      connectors:
        A: {type: integral, mates: gps.J1}
        B: {type: jst-gh-4-housing, mates: hat.J_GPS}
      wires:
        - {id: W_GPS_5V, from: A.1, to: B.1, awg: 28, color: red, signal: 5V}
        - {id: W_GPS_PI_TX, from: A.2, to: B.2, awg: 28, color: white, signal: GPS_TX}
        - {id: W_GPS_PI_RX, from: A.3, to: B.3, awg: 28, color: green, signal: GPS_RX}
        - {id: W_GPS_GND, from: A.4, to: B.4, awg: 28, color: black, signal: GND}
      route: {slack: 20 mm, tie_points: [[44 mm, 5.5 mm, 102.453 mm]]}
    # RTCM3 corrections: correction radio TX -> rover UART2 RX; the radio is powered from the rover's 5 V input.
    - id: rtk_radio_lead
      connectors:
        A: {type: integral, mates: gps.J2}
        B: {type: integral, mates: rtk_radio.J1}
      wires:
        - {id: W_RTK_5V, from: A.1, to: B.1, awg: 28, color: red, signal: 5V}
        - {id: W_RTK_RTCM, from: B.3, to: A.2, awg: 28, color: white, signal: RTCM}
        - {id: W_RTK_TX2, from: A.3, to: B.2, awg: 28, color: green, signal: GPS_TX2}
        - {id: W_RTK_GND, from: A.4, to: B.6, awg: 28, color: black, signal: GND}
      route: {slack: 30 mm, tie_points: [[30 mm, -18 mm, 113 mm]]}
    - id: encoder_lead
      connectors:
        A: {type: integral, mates: encoder.J1}
        B: {type: jst-xh-3-housing, mates: hat.J_ENC}
      wires:
        - {id: W_ENC_VCC, from: A.1, to: B.1, awg: 26, color: red, signal: 3V3}
        - {id: W_ENC_OUT, from: A.2, to: B.2, awg: 26, color: yellow, signal: ENC}
        - {id: W_ENC_GND, from: A.3, to: B.3, awg: 26, color: black, signal: GND}
      # The Hall board's lead leaves its lower corner along the plate, away from the spur cover, the magnet carrier
      # and the rear wheel, and wraps the deck's right edge behind the rear-right standoff (not the HAT lead slot).
      route: {keep_away: [wheel_rr, gearbox, motor, lead_post], slack: 25 mm, tie_points: [[45 mm, -62 mm, 58 mm], [45 mm, -62 mm, 104 mm], [45 mm, -25 mm, 120 mm]], via: [[44 mm, -43 mm, 120 mm]]}
    - id: imu_lead
      description: Keyed HAT I2C lead to owned GY-521 solder pads; AD0 stays low (0x68), no added pull-ups.
      connectors:
        A: {type: jst-gh-4-housing, mates: hat.J_IMU}
        B: {type: solder-wire-1x8-2.54, mates: imu.J1}
      wires:
        - {id: W_IMU_VCC, from: A.1, to: B.1, awg: 28, color: red, signal: 3V3}
        - {id: W_IMU_GND, from: A.2, to: B.2, awg: 28, color: black, signal: GND}
        - {id: W_IMU_SDA, from: A.3, to: B.4, awg: 28, color: blue, signal: I2C_SDA}
        - {id: W_IMU_SCL, from: A.4, to: B.3, awg: 28, color: yellow, signal: I2C_SCL}
      # Three capped posts hold the lead above the Pi IO block and clear of the drivetrain.
      route: {slack: 15 mm, tie_points: [[135 mm, -65.293 mm, 105 mm], [159.293 mm, -40 mm, 114.9 mm], [153.293 mm, -8 mm, 114.6 mm]], via: [[155 mm, -65 mm, 114 mm]]}

