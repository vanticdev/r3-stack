schema: r3/robot@1
robot:
  name: r3-rc-car
  description: >
    1/10-scale rear-wheel-drive autonomous RC car. Raspberry Pi 5 + custom carrier HAT,
    brushed 540 motor, 2S LiPo, ExpressLRS radio as safety link/override, GPS + IMU + wheel encoder.
  version: 0.1.0

requirements:
  max_mass: 2.2 kg
  top_speed: 8 m/s
  min_runtime: 15 min
  radio_range: 300 m
  # Failsafe stop distance from the fault (link loss, hung software) to standstill, at the autonomous
  # maximum cruise speed (software.config.max_cruise_speed_mps); proven by range_failsafe and pi_hang.
  failsafe_stop_distance: 3 m
  # At the 8 m/s top speed (manual driving) 3 m is physically impossible; the radio failsafe stop distance
  # proven by top_speed_failsafe (7.1 m from 8.0 m/s, 0.25 s software failsafe then ESC brake) plus ~25 % margin.
  failsafe_stop_distance_at_top_speed: 9 m
  max_wire_voltage_drop_fraction: 0.03
  min_wire_clearance_moving: 8 mm
  max_component_temperature_c: 85

# Robot frame: +x forward, +y left, +z up; origin on the ground below the rear axle center.
# Every part is retained by verified physical interfaces (fasteners, fits, straps, adhesive); see
# mechanical.fasteners / mechanical.interfaces. Right-hand fabricated parts mirror the left ones (params.mirror).
components:
  chassis:
    type: chassis-plate-al6061
    pose: {xyz: [130 mm, 0, 25 mm]}
    params:
      # Plate outline in the chassis frame: 130 mm wide rear, tapering to 80 mm ahead of
      # the battery so the steered front wheels sweep clear of the plate.
      outline: [[-170 mm, -65 mm], [40 mm, -65 mm], [70 mm, -40 mm], [170 mm, -40 mm],
                [170 mm, 40 mm], [70 mm, 40 mm], [40 mm, 65 mm], [-170 mm, 65 mm]]
  deck:
    type: upper-deck-petg
    mount: chassis
    pose: {xyz: [120 mm, 0, 75 mm]}
    params:
      # Rear-right notch clears the transmission's gear cover.
      outline: [[-66 mm, -55 mm], [85 mm, -55 mm], [85 mm, 55 mm], [-85 mm, 55 mm], [-85 mm, -28 mm], [-66 mm, -28 mm]]
  standoff_rl: {type: standoff-m3-47, mount: chassis, pose: {xyz: [40 mm, 45 mm, 28 mm]}}
  standoff_rr: {type: standoff-m3-47, mount: chassis, pose: {xyz: [78 mm, -45 mm, 28 mm]}}
  standoff_fl: {type: standoff-m3-47, mount: chassis, pose: {xyz: [195 mm, 28 mm, 28 mm]}}
  standoff_fr: {type: standoff-m3-47, mount: chassis, pose: {xyz: [195 mm, -28 mm, 28 mm]}}
  # Front steering: arms screwed to the chassis, knuckles pivot on M3 kingpin screws threaded into the arms.
  arm_fl:      {type: suspension-arm-pa12, mount: chassis, pose: {xyz: [260 mm, 47.5 mm, 28 mm]}}
  arm_fr:      {type: suspension-arm-pa12, mount: chassis, pose: {xyz: [260 mm, -47.5 mm, 28 mm]}, params: {mirror: [1, -1, 1]}}
  knuckle_fl:  {type: steering-knuckle, mount: arm_fl, pose: {xyz: [260 mm, 67.5 mm, 36 mm]}}
  knuckle_fr:  {type: steering-knuckle, mount: arm_fr, pose: {xyz: [260 mm, -67.5 mm, 36 mm]}, params: {mirror: [1, -1, 1]}}
  stub_fl:     {type: stub-axle-6mm, mount: knuckle_fl, pose: {xyz: [260 mm, 79 mm, 55 mm]}}
  stub_fr:     {type: stub-axle-6mm, mount: knuckle_fr, pose: {xyz: [260 mm, -79 mm, 55 mm]}, params: {mirror: [1, -1, 1]}}
  wheel_fl:    {type: wheel-110x45, mount: knuckle_fl, pose: {xyz: [260 mm, 100 mm, 55 mm]}}
  wheel_fr:    {type: wheel-110x45, mount: knuckle_fr, pose: {xyz: [260 mm, -100 mm, 55 mm], rpy: [0, 0, 180 deg]}}
  servo_post_a: {type: servo-post-al6061, mount: chassis, pose: {xyz: [239.8 mm, 0, 28 mm]}}
  servo_post_b: {type: servo-post-al6061, mount: chassis, pose: {xyz: [289.8 mm, 0, 28 mm]}}
  servo:       {type: servo-digital-20kg, mount: servo_post_a, pose: {xyz: [264.8 mm, 0, 29 mm], rpy: [0, 0, 90 deg]}}
  servo_horn:  {type: servo-horn-al7075, mount: servo, pose: {xyz: [254.8 mm, 0, 70.5 mm]}}
  tie_rod:     {type: steering-tie-rod, mount: servo_horn, pose: {xyz: [235 mm, 6 mm, 82.6 mm]}}
  tie_rod_r:   {type: steering-tie-rod, mount: servo_horn, pose: {xyz: [235 mm, -6 mm, 82.6 mm]}, params: {mirror: [1, -1, 1]}}
  # Rear drivetrain: transmission outputs drive D-flat axles running in MR106 bearings in the hub carriers.
  gearbox:     {type: gearbox-spur-diff-9.6, mount: chassis, pose: {xyz: [0, 0, 28 mm]}}
  motor:       {type: motor-540-brushed, mount: gearbox, pose: {xyz: [49 mm, -5 mm, 46 mm], rpy: [0, -50 deg, 0]}}
  hub_rl:      {type: rear-hub-carrier-al6061, mount: chassis, pose: {xyz: [0, 40 mm, 28 mm]}}
  hub_rr:      {type: rear-hub-carrier-al6061, mount: chassis, pose: {xyz: [0, -40 mm, 28 mm]}, params: {mirror: [1, -1, 1]}}
  bearing_rl:  {type: bearing-mr106zz, mount: hub_rl, pose: {xyz: [0, 83.5 mm, 55 mm]}}
  bearing_rr:  {type: bearing-mr106zz, mount: hub_rr, pose: {xyz: [0, -83.5 mm, 55 mm]}}
  wheel_rl:    {type: wheel-110x45-d, mount: chassis, pose: {xyz: [0, 100 mm, 55 mm]}}
  wheel_rr:    {type: wheel-110x45-d, mount: chassis, pose: {xyz: [0, -100 mm, 55 mm], rpy: [0, 0, 180 deg]}}
  axle_rl:
    type: axle-shaft-6mm
    mount: wheel_rl
    pose: {xyz: [0, 0, 55 mm]}
    params:
      solids:
        - {kind: revolve, name: axle, position: [0, 0, 0], axis: [0, 1, 0],
           profile: [[0, 20.5 mm], [3 mm, 20.5 mm], [3 mm, 80 mm], [4 mm, 80 mm], [4 mm, 82 mm], [3 mm, 82 mm], [3 mm, 121.8 mm], [0, 121.8 mm]]}
        - {kind: box, op: remove, name: output flat, position: [0, 25.5 mm, 3.5 mm], size: [10 mm, 10.2 mm, 2 mm]}
        - {kind: box, op: remove, name: wheel flat, position: [0, 102.75 mm, 3.5 mm], size: [10 mm, 23.5 mm, 2 mm]}
  axle_rr:
    type: axle-shaft-6mm
    mount: wheel_rr
    pose: {xyz: [0, 0, 55 mm]}
    params:
      mirror: [1, -1, 1]
      solids:
        - {kind: revolve, name: axle, position: [0, 0, 0], axis: [0, 1, 0],
           profile: [[0, 23.5 mm], [3 mm, 23.5 mm], [3 mm, 80 mm], [4 mm, 80 mm], [4 mm, 82 mm], [3 mm, 82 mm], [3 mm, 121.8 mm], [0, 121.8 mm]]}
        - {kind: box, op: remove, name: output flat, position: [0, 28.5 mm, 3.5 mm], size: [10 mm, 10.2 mm, 2 mm]}
        - {kind: box, op: remove, name: wheel flat, position: [0, 102.75 mm, 3.5 mm], size: [10 mm, 23.5 mm, 2 mm]}
  spacer_rl:   {type: wheel-spacer-6x9, mount: axle_rl, pose: {xyz: [0, 88.25 mm, 55 mm]}}
  spacer_rr:   {type: wheel-spacer-6x9, mount: axle_rr, pose: {xyz: [0, -88.25 mm, 55 mm]}}
  encoder:     {type: hall-encoder-a1120, mount: gearbox, pose: {xyz: [0, 34 mm, 38 mm]}}
  enc_ring:    {type: encoder-magnet-ring, mount: axle_rl, pose: {xyz: [0, 34 mm, 55 mm]}}
  enc_magnet_1: {type: magnet-n52-2x1, mount: enc_ring, pose: {xyz: [0, 34 mm, 45 mm]}}
  enc_magnet_2: {type: magnet-n52-2x1, mount: enc_ring, pose: {xyz: [0, 34 mm, 64 mm]}}
  enc_magnet_3: {type: magnet-n52-2x1, mount: enc_ring, pose: {xyz: [9 mm, 34 mm, 55 mm], rpy: [0, 90 deg, 0]}}
  enc_magnet_4: {type: magnet-n52-2x1, mount: enc_ring, pose: {xyz: [-10 mm, 34 mm, 55 mm], rpy: [0, 90 deg, 0]}}
  # Electronics.
  tape_esc:    {type: foam-tape-3m-4026, mount: chassis, pose: {xyz: [70 mm, 42 mm, 28 mm]}, params: {size: [44 mm, 32 mm, 1.6 mm]}}
  esc:         {type: esc-brushed-60a, mount: tape_esc, pose: {xyz: [70 mm, 42 mm, 29.6 mm]}}
  battery:     {type: lipo-2s-5000-25c, mount: chassis, pose: {xyz: [158 mm, 0, 28 mm]}}
  battery_strap:
    type: strap-hook-loop-20
    mount: chassis
    pose: {xyz: [158 mm, 0, 0]}
    params:
      solids:
        - {kind: prism, name: strap loop, position: [-10 mm, 0, 0], axis: [1, 0, 0], u_axis: [0, 1, 0], depth: 20 mm,
           profile: [[-25 mm, 23.5 mm], [25 mm, 23.5 mm], [25 mm, 54.5 mm], [-25 mm, 54.5 mm]],
           inner: [[[-23.5 mm, 25 mm], [23.5 mm, 25 mm], [23.5 mm, 53 mm], [-23.5 mm, 53 mm]]]}
  fuse:        {type: fuse-atc-10a, mount: chassis, pose: {xyz: [75 mm, 0, 28 mm], rpy: [0, 0, 90 deg]}}
  fuse_tie:
    type: zip-tie-2.5
    mount: chassis
    pose: {xyz: [75 mm, 0, 0]}
    params:
      solids:
        - {kind: prism, name: tie loop, position: [0, -1.25 mm, 0], axis: [0, 1, 0], u_axis: [-1, 0, 0], depth: 2.5 mm,
           profile: [[-7 mm, 24 mm], [7 mm, 24 mm], [7 mm, 51 mm], [-7 mm, 51 mm]],
           inner: [[[-6 mm, 25 mm], [6 mm, 25 mm], [6 mm, 50 mm], [-6 mm, 50 mm]]]}
  pi_spacer_1: {type: spacer-m2.5-ff-10, mount: deck, pose: {xyz: [71 mm, -24.5 mm, 78 mm]}}
  pi_spacer_2: {type: spacer-m2.5-ff-10, mount: deck, pose: {xyz: [129 mm, -24.5 mm, 78 mm]}}
  pi_spacer_3: {type: spacer-m2.5-ff-10, mount: deck, pose: {xyz: [71 mm, 24.5 mm, 78 mm]}}
  pi_spacer_4: {type: spacer-m2.5-ff-10, mount: deck, pose: {xyz: [129 mm, 24.5 mm, 78 mm]}}
  pi:          {type: raspberry-pi-5-8gb, mount: deck, pose: {xyz: [110 mm, 0, 88 mm]}}
  # HAT holes and header coincide with the Pi's (HAT left edge flush with the Pi's left edge).
  hat:         {type: r3-carrier-hat, mount: pi, pose: {xyz: [100 mm, 0, 100.6 mm]}}
  tape_rx:     {type: foam-tape-3m-4026, mount: deck, pose: {xyz: [190 mm, 40 mm, 78 mm]}, params: {size: [11 mm, 9 mm, 1.6 mm]}}
  receiver:    {type: elrs-receiver-2g4, mount: tape_rx, pose: {xyz: [190 mm, 40 mm, 79.6 mm]}}
  antenna_mast: {type: antenna-mast-petg, mount: deck, pose: {xyz: [175 mm, 0, 78 mm]}}
  rx_antenna:  {type: elrs-t-antenna, mount: antenna_mast, pose: {xyz: [175 mm, 0, 81 mm]}}
  tape_gps:    {type: foam-tape-3m-4026, mount: deck, pose: {xyz: [55 mm, 30 mm, 78 mm]}, params: {size: [18 mm, 18 mm, 1.6 mm]}}
  gps:         {type: gps-ublox-m10, mount: tape_gps, pose: {xyz: [55 mm, 30 mm, 79.6 mm]}}

mechanical:
  joints:
    - {id: steer_fl, type: revolute, parent: chassis, child: knuckle_fl, origin: [260 mm, 67.5 mm, 55 mm], axis: [0, 0, 1], limits: [-0.45, 0.45], damping: 0.02, interface: kingpin_fl}
    - {id: steer_fr, type: revolute, parent: chassis, child: knuckle_fr, origin: [260 mm, -67.5 mm, 55 mm], axis: [0, 0, 1], limits: [-0.45, 0.45], damping: 0.02, interface: kingpin_fr}
    - {id: spin_fl, type: continuous, parent: knuckle_fl, child: wheel_fl, origin: [260 mm, 100 mm, 55 mm], axis: [0, 1, 0], damping: 0.0005, interface: hub_fl}
    - {id: spin_fr, type: continuous, parent: knuckle_fr, child: wheel_fr, origin: [260 mm, -100 mm, 55 mm], axis: [0, 1, 0], damping: 0.0005, interface: hub_fr}
    - {id: spin_rl, type: continuous, parent: chassis, child: wheel_rl, origin: [0, 100 mm, 55 mm], axis: [0, 1, 0], damping: 0.0005, interface: bearing_axle_rl}
    - {id: spin_rr, type: continuous, parent: chassis, child: wheel_rr, origin: [0, -100 mm, 55 mm], axis: [0, 1, 0], damping: 0.0005, interface: bearing_axle_rr}
  transmissions:
    - id: drivetrain
      type: differential
      actuator: motor
      joints: [spin_rl, spin_rr]
      ratio: 9.6
      efficiency: 0.88
      path: [motor_pinion, output_l, output_r, wheel_drive_rl, wheel_drive_rr]
    - id: steering
      type: ackermann_steering
      actuator: servo
      joints: [steer_fl, steer_fr]
      ratio: 0.85           # wheel angle per horn angle near full lock; the CAD steering table supersedes it
      params: {wheelbase: 260 mm, kingpin_track: 135 mm, max_steer: 0.45, servo_travel: 30 deg}
      path: [horn_spline, bs_hl, bj_hl, bj_kl, bs_kl, bs_hr, bj_hr, bj_kr, bs_kr]

  # Fastener position = head seat (or nut bearing face), axis = insertion direction.
  fasteners:
    # Transmission to chassis (from below into the case's tapped holes).
    - {id: gb_1, type: shcs-m3, length: 10 mm, position: [-18 mm, -22 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: gearbox}
    - {id: gb_2, type: shcs-m3, length: 10 mm, position: [-18 mm, 22 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: gearbox}
    - {id: gb_3, type: shcs-m3, length: 10 mm, position: [18 mm, -22 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: gearbox}
    - {id: gb_4, type: shcs-m3, length: 10 mm, position: [18 mm, 22 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: gearbox}
    # Motor to the transmission's motor plate (through the mesh-adjust slots).
    - {id: mot_1, type: shcs-m3, length: 8 mm, position: [57.0348 mm, -33 mm, 55.5756 mm], axis: [0, 1, 0], clamps: [gearbox], thread_into: motor}
    - {id: mot_2, type: shcs-m3, length: 8 mm, position: [40.9652 mm, -33 mm, 36.4244 mm], axis: [0, 1, 0], clamps: [gearbox], thread_into: motor}
    # Rear hub carriers to chassis.
    - {id: hub_l1, type: shcs-m3, length: 8 mm, position: [-7 mm, 47 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rl}
    - {id: hub_l2, type: shcs-m3, length: 8 mm, position: [7 mm, 47 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rl}
    - {id: hub_l3, type: shcs-m3, length: 8 mm, position: [-7 mm, 59 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rl}
    - {id: hub_l4, type: shcs-m3, length: 8 mm, position: [7 mm, 59 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rl}
    - {id: hub_r1, type: shcs-m3, length: 8 mm, position: [-7 mm, -47 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rr}
    - {id: hub_r2, type: shcs-m3, length: 8 mm, position: [7 mm, -47 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rr}
    - {id: hub_r3, type: shcs-m3, length: 8 mm, position: [-7 mm, -59 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rr}
    - {id: hub_r4, type: shcs-m3, length: 8 mm, position: [7 mm, -59 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: hub_rr}
    # Rear wheel stacks: nyloc clamps wheel, spacer and bearing inner race against the axle collar.
    - {id: nut_rl, type: nut-m6-nyloc, position: [0, 114.5 mm, 55 mm], axis: [0, -1, 0], clamps: [wheel_rl, spacer_rl, bearing_rl], thread_into: axle_rl}
    - {id: nut_rr, type: nut-m6-nyloc, position: [0, -114.5 mm, 55 mm], axis: [0, 1, 0], clamps: [wheel_rr, spacer_rr, bearing_rr], thread_into: axle_rr}
    # Encoder board to the transmission case.
    - {id: enc_1, type: shcs-m2, length: 16 mm, position: [-3.5 mm, 38 mm, 41 mm], axis: [0, -1, 0], clamps: [encoder], thread_into: gearbox}
    - {id: enc_2, type: shcs-m2, length: 16 mm, position: [3.5 mm, 38 mm, 41 mm], axis: [0, -1, 0], clamps: [encoder], thread_into: gearbox}
    # Deck stack: chassis -> standoffs from below, deck -> standoffs from above.
    - {id: so_rl_b, type: shcs-m3, length: 8 mm, position: [40 mm, 45 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: standoff_rl}
    - {id: so_rr_b, type: shcs-m3, length: 8 mm, position: [78 mm, -45 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: standoff_rr}
    - {id: so_fl_b, type: shcs-m3, length: 8 mm, position: [195 mm, 28 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: standoff_fl}
    - {id: so_fr_b, type: shcs-m3, length: 8 mm, position: [195 mm, -28 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: standoff_fr}
    - {id: so_rl_t, type: shcs-m3, length: 8 mm, position: [40 mm, 45 mm, 78 mm], axis: [0, 0, -1], clamps: [deck], thread_into: standoff_rl}
    - {id: so_rr_t, type: shcs-m3, length: 8 mm, position: [78 mm, -45 mm, 78 mm], axis: [0, 0, -1], clamps: [deck], thread_into: standoff_rr}
    - {id: so_fl_t, type: shcs-m3, length: 8 mm, position: [195 mm, 28 mm, 78 mm], axis: [0, 0, -1], clamps: [deck], thread_into: standoff_fl}
    - {id: so_fr_t, type: shcs-m3, length: 8 mm, position: [195 mm, -28 mm, 78 mm], axis: [0, 0, -1], clamps: [deck], thread_into: standoff_fr}
    # Front suspension arms to chassis.
    - {id: arm_l1, type: shcs-m3, length: 10 mm, position: [260 mm, 27 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: arm_fl}
    - {id: arm_l2, type: shcs-m3, length: 10 mm, position: [260 mm, 35 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: arm_fl}
    - {id: arm_r1, type: shcs-m3, length: 10 mm, position: [260 mm, -27 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: arm_fr}
    - {id: arm_r2, type: shcs-m3, length: 10 mm, position: [260 mm, -35 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: arm_fr}
    # Kingpins: threadlocked M3 screws into the arms; the knuckle turns on the shank (0.15 mm head clearance).
    - {id: kp_fl, type: shcs-m3, length: 20 mm, position: [260 mm, 67.5 mm, 48.15 mm], axis: [0, 0, -1], thread_into: arm_fl, preloaded: false}
    - {id: kp_fr, type: shcs-m3, length: 20 mm, position: [260 mm, -67.5 mm, 48.15 mm], axis: [0, 0, -1], thread_into: arm_fr, preloaded: false}
    # Front wheels retained on the stub axles by nylocs set with 0.1 mm end play.
    - {id: nut_fl, type: nut-m6-nyloc, position: [260 mm, 114.6 mm, 55 mm], axis: [0, -1, 0], thread_into: stub_fl, preloaded: false}
    - {id: nut_fr, type: nut-m6-nyloc, position: [260 mm, -114.6 mm, 55 mm], axis: [0, 1, 0], thread_into: stub_fr, preloaded: false}
    # Steering linkage ball studs (horn and knuckle steering arms).
    - {id: bs_hl, type: ball-stud-m3-5.8, length: 6 mm, position: [235 mm, 6 mm, 76.5 mm], axis: [0, 0, -1], thread_into: servo_horn}
    - {id: bs_hr, type: ball-stud-m3-5.8, length: 6 mm, position: [235 mm, -6 mm, 76.5 mm], axis: [0, 0, -1], thread_into: servo_horn}
    - {id: bs_kl, type: ball-stud-m3-5.8, length: 8 mm, position: [235 mm, 67.5 mm, 76.5 mm], axis: [0, 0, -1], thread_into: knuckle_fl}
    - {id: bs_kr, type: ball-stud-m3-5.8, length: 8 mm, position: [235 mm, -67.5 mm, 76.5 mm], axis: [0, 0, -1], thread_into: knuckle_fr}
    # Servo horn screw into the output spline; servo ears onto the posts; posts to chassis.
    - {id: horn_screw, type: shcs-m3, length: 10 mm, position: [254.8 mm, 0, 78 mm], axis: [0, 0, -1], clamps: [servo_horn], thread_into: servo}
    - {id: ear_1, type: shcs-m3, length: 8 mm, position: [240.05 mm, 5 mm, 58 mm], axis: [0, 0, -1], clamps: [servo], thread_into: servo_post_a}
    - {id: ear_2, type: shcs-m3, length: 8 mm, position: [240.05 mm, -5 mm, 58 mm], axis: [0, 0, -1], clamps: [servo], thread_into: servo_post_a}
    - {id: ear_3, type: shcs-m3, length: 8 mm, position: [289.55 mm, 5 mm, 58 mm], axis: [0, 0, -1], clamps: [servo], thread_into: servo_post_b}
    - {id: ear_4, type: shcs-m3, length: 8 mm, position: [289.55 mm, -5 mm, 58 mm], axis: [0, 0, -1], clamps: [servo], thread_into: servo_post_b}
    - {id: post_1, type: shcs-m3, length: 8 mm, position: [240.05 mm, 5 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: servo_post_a}
    - {id: post_2, type: shcs-m3, length: 8 mm, position: [240.05 mm, -5 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: servo_post_a}
    - {id: post_3, type: shcs-m3, length: 8 mm, position: [289.55 mm, 5 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: servo_post_b}
    - {id: post_4, type: shcs-m3, length: 8 mm, position: [289.55 mm, -5 mm, 25 mm], axis: [0, 0, 1], clamps: [chassis], thread_into: servo_post_b}
    # Pi stack: deck -> spacers (below), Pi clamped by male-female standoffs, HAT screwed onto the standoffs.
    - {id: pi_d1, type: shcs-m2.5, length: 8 mm, position: [71 mm, -24.5 mm, 75 mm], axis: [0, 0, 1], clamps: [deck], thread_into: pi_spacer_1}
    - {id: pi_d2, type: shcs-m2.5, length: 8 mm, position: [129 mm, -24.5 mm, 75 mm], axis: [0, 0, 1], clamps: [deck], thread_into: pi_spacer_2}
    - {id: pi_d3, type: shcs-m2.5, length: 8 mm, position: [71 mm, 24.5 mm, 75 mm], axis: [0, 0, 1], clamps: [deck], thread_into: pi_spacer_3}
    - {id: pi_d4, type: shcs-m2.5, length: 8 mm, position: [129 mm, 24.5 mm, 75 mm], axis: [0, 0, 1], clamps: [deck], thread_into: pi_spacer_4}
    - {id: pi_s1, type: standoff-mf-m2.5-11, position: [71 mm, -24.5 mm, 89.6 mm], axis: [0, 0, -1], clamps: [pi], thread_into: pi_spacer_1}
