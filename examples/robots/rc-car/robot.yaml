    - {id: pi_seat_3, a: pi_spacer_3.top, b: pi.h3}
    - {id: pi_seat_4, a: pi_spacer_4.top, b: pi.h4}
    - {id: pi_shim_1, a: pi.t1, b: pi_shim_1.bottom}
