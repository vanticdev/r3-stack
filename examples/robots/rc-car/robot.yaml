    - {id: imu_outboard_post_mount, a: deck.imu_outboard_post, b: imu_outboard_post.base, fasteners: {type: M3x10}}
    - {id: cap_imu_outboard_post, a: deck.cap_imu_outboard_post, b: cap_imu_outboard_post.seat}
    - {id: imu_south_post_mount, a: deck.imu_south_post, b: imu_south_post.base, fasteners: {type: M3x10}}
    - {id: cap_imu_south_post, a: deck.cap_imu_south_post, b: cap_imu_south_post.seat}
