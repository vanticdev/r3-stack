    - {id: cap_imu_corner_post, a: deck.cap_imu_corner_post, b: cap_imu_corner_post.seat}
    # Pi stack: deck -> F-F spacers (screws from below), Pi on the spacers, M-F standoffs clamp the Pi into the
    # spacers' top threads, HAT screwed onto the standoffs, header into socket.
    # Official Pi laminate: 1.276 mm. Four purchased DIN 988 0.3 mm shims plus 11 mm standoffs put
    # the HAT underside 12.576 mm above the Pi underside. The 8.5 mm socket mouth is at 4.076 mm:
    # The vendor datum is 0.030 mm below the laminate: 0.226 mm plastic clearance, 5.774 mm insertion,
    # and 2.364 mm beyond the Harwin M20-783 contact point (3.41 mm from the socket mouth).
    - {id: pi_spacer_1, a: deck.pi_1, b: pi_spacer_1.bottom, fasteners: {type: M2.5x8}}
    - {id: pi_spacer_2, a: deck.pi_2, b: pi_spacer_2.bottom, fasteners: {type: M2.5x8}}
