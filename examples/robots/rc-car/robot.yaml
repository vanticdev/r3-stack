    - {id: pi_s1, a: pi_spacer_1.top, b: pi_standoff_1.stud, offset: 1.576 mm, fasteners: {type: M2.5x6, clamps: [pi_shim_1, pi]}}
    - {id: pi_s2, a: pi_spacer_2.top, b: pi_standoff_2.stud, offset: 1.576 mm, fasteners: {type: M2.5x6, clamps: [pi_shim_2, pi]}}
    - {id: pi_s3, a: pi_spacer_3.top, b: pi_standoff_3.stud, offset: 1.576 mm, fasteners: {type: M2.5x6, clamps: [pi_shim_3, pi]}}
    - {id: pi_s4, a: pi_spacer_4.top, b: pi_standoff_4.stud, offset: 1.576 mm, fasteners: {type: M2.5x6, clamps: [pi_shim_4, pi]}}
    - {id: hat_1, a: pi_standoff_1.top, b: hat.h3, fasteners: {type: M2.5x6}}
    - {id: hat_2, a: pi_standoff_2.top, b: hat.h4, fasteners: {type: M2.5x6}}
    - {id: hat_3, a: pi_standoff_3.top, b: hat.h1, fasteners: {type: M2.5x6}}
    - {id: hat_4, a: pi_standoff_4.top, b: hat.h2, fasteners: {type: M2.5x6}}
    - {id: gpio_header, a: pi.J8, b: hat.socket, offset: 0.230 mm, verify: {min_insertion: 5.5 mm, lateral_tolerance: 0.2 mm}}
    - {id: cap_hat_1, a: hat.cap_1, b: cap_hat_1.seat}
    - {id: cap_hat_2, a: hat.cap_2, b: cap_hat_2.seat}
    - {id: cap_hat_3, a: hat.cap_3, b: cap_hat_3.seat}
