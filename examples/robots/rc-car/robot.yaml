    Front steering L: [arm_fl, kp_fl, knuckle_fl, stub_fl, wheel_fl, nut_fl, bs_kl]
    Front steering R: [arm_fr, kp_fr, knuckle_fr, stub_fr, wheel_fr, nut_fr, bs_kr]
    Steering linkage: [servo_post_a, servo_post_b, servo, servo_output, servo_horn, bs_hl, bs_hr, tie_rod, tie_rod_r,
                       cap_ear_a1, cap_ear_a2, cap_ear_b1, cap_ear_b2]
    Deck and electronics stack: [standoff_rl, standoff_rr, standoff_fl, standoff_fr, deck, cap_so_rl, cap_so_rr, cap_so_fl, cap_so_fr,
                                 pi_spacer_1, pi_spacer_2, pi_spacer_3, pi_spacer_4, pi, pi_standoff_1, pi_standoff_2, pi_standoff_3,
                                 pi_standoff_4, pi_shim_1, pi_shim_2, pi_shim_3, pi_shim_4, hat, cap_hat_1, cap_hat_2, cap_hat_3, cap_hat_4, receiver_riser, tape_rx, receiver, antenna_mast,
                                 rx_antenna, imu, imu_mount, imu_outboard_post, cap_imu_outboard_post, imu_south_post, cap_imu_south_post, cap_imu_1, cap_imu_2, imu_corner_post, cap_imu_corner_post,
                                 tape_rtk_radio, rtk_radio, lead_post, sensor_lead_post, cap_sensor_lead_post, cap_lead_post]
    Power: [battery, battery_strap, fuse, fuse_tie, tape_esc, esc, power_lead_post, cap_power_lead_post]

    Front camera:
    - front_camera
    - camera_mount
    - camera_fpc
    - cap_camera_1
    - cap_camera_2
    - cap_camera_3
    - cap_camera_4
    - cap_camera_mount_1
    - cap_camera_mount_2
    - camera_tape
software:
  modules:
    - {name: rc_car_controller, language: python, runs_on: pi, entrypoint: main.py}
  bindings:
    esc_pwm:   {interface: pwm, computer: pi, pins: [pi.J8.12], device: pwmchip0, channel: 2, frequency: 50 Hz, expects: [esc.J_SIG.1]}
    servo_pwm: {interface: pwm, computer: pi, pins: [pi.J8.35], device: pwmchip0, channel: 3, frequency: 50 Hz, expects: [servo.J1.1]}
    crsf:      {interface: uart, computer: pi, pins: [pi.J8.8, pi.J8.10], device: /dev/ttyAMA0, baud: 420000, expects: [receiver.J1.3, receiver.J1.2]}
    gps:       {interface: uart, computer: pi, pins: [pi.J8.7, pi.J8.29], device: /dev/ttyAMA2, baud: 115200, expects: [gps.J1.2, gps.J1.3]}
    i2c:       {interface: i2c, computer: pi, pins: [pi.J8.3, pi.J8.5], device: /dev/i2c-1, expects: [imu.SDA, imu.SCL]}
    encoder:   {interface: gpio, computer: pi, pins: [pi.J8.11], device: gpiochip0, channel: 17, expects: [encoder.J1.2]}
    # Failsafe heartbeat to the HAT's ATtiny412 arbiter: toggled every control cycle (100 Hz); after 60 ms
    # without an edge the arbiter modulates the ESC brake, then sends 1500 us neutral.
    heartbeat: {interface: gpio, computer: pi, pins: [pi.J8.13], device: gpiochip0, channel: 27, expects: [hat.HEARTBEAT]}
    front_camera:
      interface: csi
      computer: pi
      device: cam0
      pins:
      - pi.CAM0.21
      - pi.CAM0.20
      expects:
      - front_camera.J1.21
      - front_camera.J1.20
  config:
    mpu6050: {address: 0x68, component: imu, mounting_rpy_deg: [0, 0, 0]}
    control_rate_hz: 100
    mode: autonomous            # autonomous | manual
    radio_failsafe_timeout_s: 0.09
    failsafe_action: brake
    low_voltage_cutoff_v: 6.6   # 3.3 V/cell under load
    low_voltage_limit_v: 7.0    # start limiting throttle
    max_cruise_speed_mps: 4.0
    esc_pulse_us: {reverse: 1000, neutral: 1500, forward: 2000}
    steering_pulse_us: {left: 1722, center: 1500, right: 1278}   # +-30 deg horn travel: CAD linkage end points
    max_steer_rad: 0.4021       # CAD steering table: single-track equivalent of inner 0.445 / outer 0.367 rad at full horn travel
    wheelbase_m: 0.26
    wheel_radius_m: 0.055
    encoder_pulses_per_rev: 9.891     # 4 magnets on the spur shaft x 2.4727 spur rev per carrier (mean rear-wheel) rev
    traction: {enabled: true, yaw_assist_enabled: true, target_slip: 0.10, motor_current_limit_a: 50.0, launch_slew_per_s: 3.0,
               yaw_gain: 0.6, gear_ratio: 9.066}   # gear_ratio: 18T/66T x 2.4727 (rear transmission catalog)
    require_rtk_fix_to_arm: true    # autonomy arms only on an RTK fixed solution (GGA quality 4)
    arm_channel: 5              # CRSF AUX channel that arms autonomy (>1700 us)
    crsf_channels: {steering: 1, throttle: 2, arm: 5}

simulation:
  timestep: 1 ms
  seed: 7
  environment:
    ground_friction: 0.9
    ground_rolling_resistance: 0.015
    ambient_temperature_c: 25
    terrain: flat-grass
    radio_transmitter: {position: [-2 m, 0, 1.2 m], power_dbm: 20, antenna_gain_dbi: 2.0}
    radio_environment: {model: sionna_rt, shadowing_sigma_db: 4.0, ground_permittivity: 15, interference_dbm: -100, gps_origin: [37.4275, -122.1697, 30.0]}
    # RTK base station on a tripod beside the start: ZED-F9P in fixed-base mode at surveyed coordinates, RTCM3 MSM7
    # at 1 Hz over a SiK 915 MHz radio. The course waypoints were recorded with this base, so its coordinate error is
    # common to the course and the rover solution (survey_error 0 in that frame).
    gnss_base:
      receiver: gnss-rtk-zed-f9p
      radio: telemetry-sik-915-100mw
      position: [-4 m, -3 m, 1.6 m]
      rtcm: {messages: {1005: 0.2 Hz, 1077: 1 Hz, 1097: 1 Hz, 1127: 1 Hz}}
    obstacles:
      - {id: cone_a, center: [12 m, 6 m, 0.15 m], size: [0.3 m, 0.3 m, 0.3 m], material: plastic}
  scenarios:
    - id: autonomous_course
      description: Arm by radio, then follow a 30 x 15 m rectangular GPS course twice at cruise speed.
      duration: 90 s
      initial: {battery_soc: 0.95}
      pilot: {arm_at: 1.0 s}
      mission: {type: waypoints, laps: 2, speed: 4.0, waypoints: [[5, 0], [35, 0], [35, 15], [5, 15]]}
      expect: {laps_completed: 2, max_cross_track_error_m: 1.5, failsafe_events: 0, min_battery_voltage_v: 6.8, brownouts: 0}
    - id: full_throttle
      description: Manual mode, full throttle from rest for 6 s straight, then neutral.
      duration: 10 s
      initial: {battery_soc: 1.0, mode: manual}
      pilot: {arm_at: 0.5 s, throttle: [[0, 0.0], [1.0, 1.0], [7.0, 0.0]], steering: [[0, 0.0]]}
      expect: {min_top_speed_mps: 8.0, brownouts: 0}
    - id: range_failsafe
      description: Autonomous straight run at the maximum cruise speed away from the transmitter until the radio link is lost; car must brake.
      duration: 300 s
      initial: {battery_soc: 0.95}
      pilot: {arm_at: 1.0 s}
      mission: {type: waypoints, laps: 1, speed: 4.0, waypoints: [[5, 0], [1500, 0]]}
      expect: {link_lost_beyond_m: 300, stop_within_m_of_link_loss: 3.0}
    - id: pi_hang
      description: >
        Autonomous straight run at the maximum cruise speed; the robot software freezes (SIGSTOP) at 15 s while the
        Pi's PWM peripheral keeps the last throttle. The HAT arbiter must force neutral within 100 ms of the last
        heartbeat edge and the car must stop.
      duration: 40 s
      initial: {battery_soc: 0.95}
      pilot: {arm_at: 1.0 s}
      mission: {type: waypoints, laps: 1, speed: 4.0, waypoints: [[5, 0], [400, 0]]}
      faults:
        - {type: software_freeze, at: 15 s, method: sigstop}
      expect: {arbiter_neutral_within_s: 0.12, stop_within_m_of_fault: 3.0, max_failsafe_yaw_deg: 30, brownouts: 0}
    - id: top_speed_failsafe
      description: >
        Manual full throttle to top speed, then the transmitter is switched off; the receiver sends no frames
        ("no pulses" failsafe) and the software must brake to a stop.
      duration: 16 s
      initial: {battery_soc: 1.0, mode: manual}
      pilot: {arm_at: 0.5 s, throttle: [[0, 0.0], [1.0, 1.0]], steering: [[0, 0.0]]}
      faults:
        - {type: transmitter_off, at: 7.0 s}
      expect: {min_top_speed_mps: 8.0, stop_within_m_of_link_loss: 9.0, max_failsafe_yaw_deg: 30, brownouts: 0}
    - id: low_battery
      description: Start nearly empty; firmware must cut throttle before cells drop below 3.0 V and the Pi must not brown out.
      duration: 120 s
      initial: {battery_soc: 0.02}
      pilot: {arm_at: 1.0 s}
      mission: {type: waypoints, laps: 5, speed: 4.0, waypoints: [[5, 0], [35, 0], [35, 15], [5, 15]]}
      expect: {min_cell_voltage_v: 3.0, low_voltage_cutoff_engaged: true, brownouts: 0}
    - id: steering_sweep
      description: Manual lock-to-lock steering at standstill and at 2 m/s to exercise wire slack near the front wheels.
      duration: 12 s
      initial: {battery_soc: 0.9, mode: manual}
      pilot: {arm_at: 0.5 s, throttle: [[0, 0.0], [6.0, 0.25]], steering: [[0, 0.0], [1, 1.0], [2, -1.0], [3, 1.0], [4, -1.0], [5, 0.0], [7, 1.0], [8, -1.0], [9, 1.0], [10, -1.0], [11, 0.0]]}
      expect: {min_wire_clearance_m: 0.008}
