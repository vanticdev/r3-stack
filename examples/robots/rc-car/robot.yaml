schema: r3/robot@1
robot:
  name: r3-rc-car
  description: >
    1/10-scale rear-wheel-drive autonomous RC car. Raspberry Pi 5 + custom carrier HAT,
    brushed 540 motor, 2S LiPo, ExpressLRS radio as safety link/override, GPS + IMU + wheel encoder.
  version: 0.1.0

requirements:
  max_mass: 2.2 kg
  top_speed: 8 m/s
  min_runtime: 15 min
  radio_range: 300 m
  # Failsafe stop distance from the fault (link loss, hung software) to standstill, at the autonomous
  # maximum cruise speed (software.config.max_cruise_speed_mps); proven by range_failsafe and pi_hang.
  failsafe_stop_distance: 3 m
  # Manual top-speed stops use encoder/IMU anti-lock modulation and centred steering. The 90 ms radio
  # timeout limits detection travel; the independent 60 ms heartbeat watchdog plus 20 ms frame is faster.
  failsafe_stop_distance_at_top_speed: 9 m
  max_wire_voltage_drop_fraction: 0.03
  min_wire_clearance_moving: 8 mm
  max_component_temperature_c: 85

# Robot frame: +x forward, +y left, +z up; origin on the ground below the rear axle center.
# Objects are joined at catalog interfaces (assembly.joins, below); every pose except the root's is derived by the
# assembly compiler, so a part cannot sit inside another and its holes line up with the holes it bolts to. Right-hand
# fabricated parts mirror the left ones (params.mirror). Fasteners, fit interfaces and joints for the CAD fit checks
# are derived from the joins (r3_model.mechanics); see docs/architecture/assembly-model.md.
components:
  chassis:
    type: chassis-plate-al6061
    pose: {xyz: [130 mm, 0, 25 mm]}
    params:
      # Plate outline in the chassis frame: 130 mm wide rear, tapering to 80 mm ahead of
      # the battery so the steered front wheels sweep clear of the plate.
      outline: [[-170 mm, -65 mm], [-86 mm, -65 mm], [-86 mm, -70 mm], [-70 mm, -70 mm], [-70 mm, -65 mm], [40 mm, -65 mm], [70 mm, -40 mm], [170 mm, -40 mm], [170 mm, 40 mm], [70 mm, 40 mm], [40 mm, 65 mm], [-170 mm, 65 mm]]
  deck:
    type: upper-deck-petg
    params:
      # Rear-right notch clears the transmission's gear cover.
      # Rear-left tab carries the so_rl standoff behind the motor terminals (3 mm clear of the gear case at y < 30 mm);
      # the right-edge tab carries the lead post's screw (edge distance) beside the lead slot.
      outline: [[-66 mm, -55 mm], [-49 mm, -55 mm], [-49 mm, -120 mm], [5 mm, -120 mm], [5 mm, -80 mm], [55 mm, -80 mm], [55 mm, -55 mm], [85 mm, -55 mm], [85 mm, 55 mm], [-94 mm, 55 mm], [-94 mm, 33 mm], [-85 mm, 33 mm], [-85 mm, -28 mm], [-66 mm, -28 mm]]
  standoff_rl: {type: standoff-m3-47}
  standoff_rr: {type: standoff-m3-47}
  standoff_fl: {type: standoff-m3-47}
  standoff_fr: {type: standoff-m3-47}
  cap_so_rl: {type: screw-cap-m3-petg}
  cap_so_rr: {type: screw-cap-m3-petg}
  cap_so_fl: {type: screw-cap-m3-petg}
  cap_so_fr: {type: screw-cap-m3-petg}
  # Front steering: arms screwed to the chassis; knuckles pivot on M3 kingpin screws threaded into the arms.
  arm_fl:      {type: suspension-arm-pa12}
  arm_fr:      {type: suspension-arm-pa12, params: {mirror: [1, -1, 1]}}
  kp_fl:       {type: kingpin-screw-m3x20}
  kp_fr:       {type: kingpin-screw-m3x20}
  knuckle_fl:  {type: steering-knuckle}
  knuckle_fr:  {type: steering-knuckle, params: {mirror: [1, -1, 1]}}
  stub_fl:     {type: stub-axle-6mm}
  stub_fr:     {type: stub-axle-6mm, params: {mirror: [1, -1, 1]}}
  # Sourcing slots (`r3 source`): the type is the current part; a pinned choice in r3.lock.yaml replaces it.
  wheel_fl:    {type: wheel-110x45, source: {group: front_wheels, requires: {kind: wheel, diameter: [100 mm, 115 mm], width: [40 mm, 50 mm], hub: 6 mm bore}}}
  wheel_fr:    {type: wheel-110x45, source: {group: front_wheels, requires: {kind: wheel, diameter: [100 mm, 115 mm], width: [40 mm, 50 mm], hub: 6 mm bore}}}
  nut_fl:      {type: wheel-nut-m6-nyloc}
  nut_fr:      {type: wheel-nut-m6-nyloc}
  bs_kl:       {type: ball-stud-m3-5.8x8}
  bs_kr:       {type: ball-stud-m3-5.8x8}
  # Steering linkage: servo on two posts, splined output, horn with two ball studs, tie rods.
  servo_post_a: {type: servo-post-al6061}
  servo_post_b: {type: servo-post-al6061-cable}   # lead pocket: the servo lead exits into this post
  servo:       {type: servo-digital-20kg}
  servo_output: {type: servo-output-25t}
  servo_horn:  {type: servo-horn-al7075}
  bs_hl:       {type: ball-stud-m3-5.8x6}
  bs_hr:       {type: ball-stud-m3-5.8x6}
  tie_rod:     {type: steering-tie-rod}
  tie_rod_r:   {type: steering-tie-rod, params: {mirror: [1, -1, 1]}}
  cap_ear_a1:  {type: screw-cap-m3-petg}
  cap_ear_a2:  {type: screw-cap-m3-petg}
  cap_ear_b1:  {type: screw-cap-m3-petg}
  cap_ear_b2:  {type: screw-cap-m3-petg}
  # Rear drivetrain: transmission outputs drive D-flat axles running in MR106 bearings in the hub carriers.
  gearbox:     {type: gearbox-spur-diff}
  motor:       {type: motor-540-brushed}
  hub_rl:      {type: rear-hub-carrier-al6061}
  hub_rr:      {type: rear-hub-carrier-al6061, params: {mirror: [1, -1, 1]}}
  bearing_rl:  {type: bearing-mr106zz}
  bearing_rr:  {type: bearing-mr106zz}
  axle_rl:     {type: rear-axle-6mm-l}
  axle_rr:     {type: rear-axle-6mm-r, params: {mirror: [1, -1, 1]}}
  spacer_rl:   {type: wheel-spacer-6x9}
  spacer_rr:   {type: wheel-spacer-6x9}
  # Rear wheels drive through D-flats on the axle (6 mm D-bore hub).
  wheel_rl:    {type: wheel-110x45-d, source: {group: rear_wheels, requires: {kind: wheel, diameter: [100 mm, 115 mm], width: [40 mm, 50 mm], hub: 6 mm d-bore}}}
  wheel_rr:    {type: wheel-110x45-d, source: {group: rear_wheels, requires: {kind: wheel, diameter: [100 mm, 115 mm], width: [40 mm, 50 mm], hub: 6 mm d-bore}}}
  nut_rl:      {type: wheel-nut-m6-nyloc}
  nut_rr:      {type: wheel-nut-m6-nyloc}
  # Drivetrain encoder: four magnets on a carrier pressed onto the spur-shaft extension; the Hall board below it
  # reads the differential carrier (mean rear-wheel speed), so one-wheel spin no longer hides from the encoder.
  encoder:     {type: hall-encoder-a1120}
  enc_ring:    {type: encoder-magnet-ring}
  enc_magnet_1: {type: magnet-n52-2x1}
  enc_magnet_2: {type: magnet-n52-2x1}
  enc_magnet_3: {type: magnet-n52-2x1}
  enc_magnet_4: {type: magnet-n52-2x1}
  # Electronics.
  tape_esc:    {type: foam-tape-3m-4026, params: {size: [44 mm, 32 mm, 1.6 mm]}}
  esc:         {type: esc-brushed-60a}
  battery:     {type: lipo-2s-5000-25c}
  battery_strap: {type: strap-hook-loop-20}
  # The fuse holder hangs in the Y harness at the splice (its input lead is the splice), tied to the plate.
  fuse:        {type: fuse-atc-7.5a}
  fuse_tie:    {type: zip-tie-2.5}
  pi_spacer_1: {type: spacer-m2.5-ff-10}
  pi_spacer_2: {type: spacer-m2.5-ff-10}
  pi_spacer_3: {type: spacer-m2.5-ff-10}
  pi_spacer_4: {type: spacer-m2.5-ff-10}
  pi:          {type: raspberry-pi-5-4gb, owned: true}
  pi_shim_1: {type: shim-din988-3x6x0.3}
  pi_shim_2: {type: shim-din988-3x6x0.3}
  pi_shim_3: {type: shim-din988-3x6x0.3}
  pi_shim_4: {type: shim-din988-3x6x0.3}
  pi_standoff_1: {type: hat-standoff-mf-m2.5-11}
  pi_standoff_2: {type: hat-standoff-mf-m2.5-11}
  pi_standoff_3: {type: hat-standoff-mf-m2.5-11}
  pi_standoff_4: {type: hat-standoff-mf-m2.5-11}
  hat:         {type: r3-carrier-hat}
  imu:         {type: gy-521-mpu6050, owned: true}
  imu_mount:   {type: imu-pedestal-petg}
  imu_outboard_post: {type: imu-lead-post-petg}
  cap_imu_outboard_post: {type: screw-cap-m3-petg}
  imu_south_post: {type: servo-south-post-petg}
  servo_approach_post: {type: servo-approach-post-petg}
  cap_servo_approach_post: {type: screw-cap-m3-petg}
  cap_imu_south_post: {type: screw-cap-m3-petg}
  cap_imu_1: {type: imu-screw-cap-1-petg}
  cap_imu_2: {type: imu-screw-cap-2-petg}
  imu_corner_post: {type: imu-lead-post-petg}
  cap_imu_corner_post: {type: screw-cap-m3-petg}
  cap_hat_1:   {type: screw-cap-m2.5-petg}
  cap_hat_2:   {type: screw-cap-m2.5-petg}
  cap_hat_3:   {type: screw-cap-m2.5-petg}
  cap_hat_4:   {type: screw-cap-m2.5-petg}
  receiver_riser: {type: receiver-riser-petg}
  tape_rx:     {type: foam-tape-3m-4026, params: {size: [11 mm, 9 mm, 1.6 mm]}}
  receiver:    {type: elrs-receiver-2g4, source: {requires: {kind: radio, protocol: crsf, band: 2.4 GHz, supply: [4.5 V, 5.5 V]}}}
  antenna_mast: {type: antenna-mast-petg}
  rx_antenna:  {type: elrs-t-antenna}
  # RTK GNSS rover: standalone GNSS (1.5 m CEP) cannot hold the 1.5 m cross-track tolerance; RTK corrections from the
  # base station (simulation.environment.gnss_base) arrive over the 915 MHz SiK link into the rover's UART2.
  tape_gps:    {type: foam-tape-3m-4026, params: {size: [34 mm, 44 mm, 1.6 mm]}}
  gps:         {type: gnss-rtk-zed-f9p}
  tape_rtk_radio: {type: foam-tape-3m-4026, params: {size: [50 mm, 10 mm, 1.6 mm]}}
  rtk_radio:   {type: telemetry-sik-915-100mw}
  motor_lead_post: {type: motor-lead-post-petg}
  power_lead_post: {type: power-lead-post-petg}
  cap_motor_lead_post: {type: screw-cap-m3-petg}
  cap_power_lead_post: {type: screw-cap-m3-petg}
  gnss_riser: {type: gnss-riser-petg}
  encoder_lead_post: {type: encoder-lead-post-petg}
  sensor_lead_post: {type: sensor-rtk-mast-petg}
  cap_encoder_lead_post: {type: screw-cap-m3-petg}
  cap_sensor_lead_post: {type: screw-cap-m3-petg}
  cap_lead_post: {type: screw-cap-m3-petg}
  lead_post:   {type: lead-post-petg}   # tie post for the leads climbing to the HAT's top-entry headers

# Join ids name the derived fasteners (<id> or <id>_<n>) and fit interfaces; `verify` holds the exact-geometry limits
# the CAD fit checks apply (radial clearances/interferences, engagement lengths, retainers).
  front_camera:
    type: arducam-b0445-imx296
    owned: true
  camera_mount:
    type: rc-camera-mount-petg
  camera_fpc:
    type: arducam-fpc-22-22-150mm
  cap_camera_1:
    type: screw-cap-m2-petg
  cap_camera_2:
    type: screw-cap-m2-petg
  cap_camera_3:
    type: screw-cap-m2-petg
  cap_camera_4:
    type: screw-cap-m2-petg
  cap_camera_mount_1:
    type: screw-cap-m3-petg
  cap_camera_mount_2:
    type: screw-cap-m3-petg
  camera_tape:
    type: foam-tape-3m-4026
    params:
      size:
      - 11.5 mm
      - 4 mm
      - 1.6 mm
  servo_climb_post:
    type: servo-climb-post-petg
  cap_servo_climb_post:
    type: screw-cap-m3-petg
  servo_upper_post:
    type: servo-upper-post-petg
  cap_servo_upper_post:
    type: screw-cap-m3-petg
assembly:
  root: chassis
  tolerance: {position: 0.05 mm, angle: 0.1 deg}
  joins:
    - {a: deck.servo_approach_post, b: servo_approach_post.base, clock: 0 deg, fasteners: {type: M3x10}, id: servo_approach_post}
    - {a: deck.cap_servo_approach_post, b: cap_servo_approach_post.seat, id: cap_servo_approach_post}
    # ---- rear drivetrain
    - {id: gb_mount, a: chassis.gearbox, b: gearbox.mount, clock: 0 deg, fasteners: {type: M3x10}}
    - {id: motor_mount, a: gearbox.motor_mount, b: motor.face, clock: -50 deg, fasteners: {type: M3x8}}
    - {id: motor_pinion, a: gearbox.pinion, b: motor.shaft, kind: drive_flat,
       verify: {internal: true, flat_offset: 1.385 mm, clearance: [1 mm, 3 mm], min_engagement: 8 mm}}
    - {id: hub_rl_mount, a: chassis.hub_rl, b: hub_rl.foot, clock: 0 deg, fasteners: {type: M3x8}}
    - {id: hub_rr_mount, a: chassis.hub_rr, b: hub_rr.foot, clock: 0 deg, fasteners: {type: M3x8}}
    - {id: output_l, a: gearbox.output_l, b: axle_rl.output, kind: revolute, joint: spin_rl, damping: 0.0005,
       verify: {kind: drive_flat, flat_offset: 2.5 mm, clearance: [0.002 mm, 0.03 mm], min_engagement: 8 mm, rotating_bore: true}}
    - {id: output_r, a: gearbox.output_r, b: axle_rr.output, kind: revolute, joint: spin_rr, damping: 0.0005,
       verify: {kind: drive_flat, flat_offset: 2.5 mm, clearance: [0.002 mm, 0.03 mm], min_engagement: 8 mm, rotating_bore: true}}
    - {id: bearing_seat_rl, a: hub_rl.bearing, b: bearing_rl.outer, fit: interference,
       verify: {interference: [0.002 mm, 0.02 mm], min_engagement: 2.5 mm}}
    - {id: bearing_seat_rr, a: hub_rr.bearing, b: bearing_rr.outer, fit: interference,
       verify: {interference: [0.002 mm, 0.02 mm], min_engagement: 2.5 mm}}
    - {id: bearing_axle_rl, a: bearing_rl.inner, b: axle_rl.bearing_seat, kind: revolute,
       verify: {clearance: [-0.005 mm, 0.01 mm], min_engagement: 2.5 mm, retainers: [nut_rl], internal_rotation: true}}
    - {id: bearing_axle_rr, a: bearing_rr.inner, b: axle_rr.bearing_seat, kind: revolute,
       verify: {clearance: [-0.005 mm, 0.01 mm], min_engagement: 2.5 mm, retainers: [nut_rr], internal_rotation: true}}
    - {id: spacer_rl_fit, a: axle_rl.spacer_seat, b: spacer_rl.bore}
    - {id: spacer_rr_fit, a: axle_rr.spacer_seat, b: spacer_rr.bore}
    - {id: wheel_drive_rl, a: axle_rl.wheel_drive, b: wheel_rl.hub, kind: drive_flat,
       verify: {flat_offset: 2.5 mm, clearance: [0.002 mm, 0.03 mm], min_engagement: 20 mm}}
    - {id: wheel_drive_rr, a: axle_rr.wheel_drive, b: wheel_rr.hub, kind: drive_flat,
       verify: {flat_offset: 2.5 mm, clearance: [0.002 mm, 0.03 mm], min_engagement: 20 mm}}
    # Nylocs clamp wheel, spacer and bearing inner race against the axle collar.
    - {id: wheel_nut_rl, a: axle_rl.nut_thread, b: nut_rl.seat, fasteners: {type: M6x7, clamps: [wheel_rl, spacer_rl, bearing_rl]}}
    - {id: wheel_nut_rr, a: axle_rr.nut_thread, b: nut_rr.seat, fasteners: {type: M6x7, clamps: [wheel_rr, spacer_rr, bearing_rr]}}
    # ---- drivetrain encoder (spur shaft = differential carrier x 2.4727)
    - {id: enc_ring_press, a: gearbox.spur_shaft, b: enc_ring.bore, offset: 1 mm, fit: interference,
       verify: {interference: [0.002 mm, 0.02 mm], min_engagement: 5 mm}}
    - {id: enc_magnet_1_bond, a: enc_ring.pocket_1, b: enc_magnet_1.body, verify: {kind: adhesive, min_fraction: 0.8}}
    - {id: enc_magnet_2_bond, a: enc_ring.pocket_2, b: enc_magnet_2.body, verify: {kind: adhesive, min_fraction: 0.8}}
    - {id: enc_magnet_3_bond, a: enc_ring.pocket_3, b: enc_magnet_3.body, verify: {kind: adhesive, min_fraction: 0.8}}
    - {id: enc_magnet_4_bond, a: enc_ring.pocket_4, b: enc_magnet_4.body, verify: {kind: adhesive, min_fraction: 0.8}}
    - {id: encoder_mount, a: gearbox.encoder, b: encoder.mount, clock: 180 deg, fasteners: {type: M2x16}}
    # ---- front corners
    - {id: arm_fl_mount, a: chassis.arm_fl, b: arm_fl.base, clock: 0 deg, fasteners: {type: M3x10}}
    - {id: arm_fr_mount, a: chassis.arm_fr, b: arm_fr.base, clock: 0 deg, fasteners: {type: M3x10}}
    - {id: kingpin_thread_fl, a: arm_fl.kingpin, b: kp_fl.thread}
    - {id: kingpin_thread_fr, a: arm_fr.kingpin, b: kp_fr.thread}
    - {id: kingpin_fl, a: kp_fl.shank, b: knuckle_fl.kingpin, kind: revolute, joint: steer_fl, limits: [-0.45, 0.45], damping: 0.02,
       verify: {clearance: [0.05 mm, 0.15 mm], min_engagement: 10 mm, retainers: [kp_fl], thrust: [arm_fl]}}
    - {id: kingpin_fr, a: kp_fr.shank, b: knuckle_fr.kingpin, kind: revolute, joint: steer_fr, limits: [-0.45, 0.45], damping: 0.02,
       verify: {clearance: [0.05 mm, 0.15 mm], min_engagement: 10 mm, retainers: [kp_fr], thrust: [arm_fr]}}
    - {id: stub_press_fl, a: knuckle_fl.stub, b: stub_fl.press, fit: interference, verify: {interference: [0.01 mm, 0.06 mm], min_engagement: 8 mm}}
    - {id: stub_press_fr, a: knuckle_fr.stub, b: stub_fr.press, fit: interference, verify: {interference: [0.01 mm, 0.06 mm], min_engagement: 8 mm}}
    - {id: hub_fl, a: stub_fl.journal, b: wheel_fl.hub, kind: revolute, joint: spin_fl, damping: 0.0005,
       verify: {clearance: [0.01 mm, 0.05 mm], min_engagement: 15 mm, retainers: [nut_fl], thrust: [stub_fl]}}
    - {id: hub_fr, a: stub_fr.journal, b: wheel_fr.hub, kind: revolute, joint: spin_fr, damping: 0.0005,
       verify: {clearance: [0.01 mm, 0.05 mm], min_engagement: 15 mm, retainers: [nut_fr], thrust: [stub_fr]}}
    # Front nylocs set with 0.1 mm end play (not clamping the turning wheel).
    - {id: wheel_nut_fl, a: stub_fl.nut_thread, b: nut_fl.seat, fasteners: {type: M6x7, preloaded: false}}
    - {id: wheel_nut_fr, a: stub_fr.nut_thread, b: nut_fr.seat, fasteners: {type: M6x7, preloaded: false}}
    - {id: bs_kl, a: knuckle_fl.ball_stud, b: bs_kl.thread}
    - {id: bs_kr, a: knuckle_fr.ball_stud, b: bs_kr.thread}
    # ---- steering linkage
    - {id: post_a_mount, a: chassis.post_a, b: servo_post_a.base, clock: 0 deg, fasteners: {type: M3x8}}
    - {id: post_b_mount, a: chassis.post_b, b: servo_post_b.base, clock: 180 deg, fasteners: {type: M3x8}}
    - {id: servo_ears_a, a: servo_post_a.top, b: servo.ears_a, clock: 90 deg, fasteners: {type: M3x8}}
    - {id: servo_ears_b, a: servo_post_b.top, b: servo.ears_b, clock: -90 deg, fasteners: {type: M3x8}}
    - {id: servo_output, a: servo.output, b: servo_output.journal, kind: revolute, joint: steer_servo, limits: [-0.5236, 0.5236],
       verify: {clearance: [0.0, 0.1 mm], min_engagement: 3.5 mm}}
    - {id: horn_spline, a: servo_output.spline, b: servo_horn.spline, offset: 1 mm, clock: -90 deg,
       verify: {clearance: [-0.005 mm, 0.02 mm], min_engagement: 3.5 mm}}
    - {id: horn_screw, a: servo_output.top, b: servo_horn.screw, fasteners: {type: M3x10}}
    - {id: bs_hl, a: servo_horn.ball_l, b: bs_hl.thread}
    - {id: bs_hr, a: servo_horn.ball_r, b: bs_hr.thread}
    - {id: bj_hl, a: bs_hl.ball, b: tie_rod.inner, kind: ball, verify: {clearance: [0.0, 0.05 mm]}}
    - {id: bj_kl, a: bs_kl.ball, b: tie_rod.outer, kind: ball, verify: {clearance: [0.0, 0.05 mm]}}
    - {id: bj_hr, a: bs_hr.ball, b: tie_rod_r.inner, kind: ball, verify: {clearance: [0.0, 0.05 mm]}}
    - {id: bj_kr, a: bs_kr.ball, b: tie_rod_r.outer, kind: ball, verify: {clearance: [0.0, 0.05 mm]}}
    # Ear caps overhang the 7 mm ear end by 1.6 mm: 73 % of the rim (12.6 mm^2) is bonded, ample for a dust cap.
    - {id: cap_ear_a1, a: servo.cap_a1, b: cap_ear_a1.seat, verify: {min_fraction: 0.7}}
    - {id: cap_ear_a2, a: servo.cap_a2, b: cap_ear_a2.seat, verify: {min_fraction: 0.7}}
    - {id: cap_ear_b1, a: servo.cap_b1, b: cap_ear_b1.seat, verify: {min_fraction: 0.7}}
    - {id: cap_ear_b2, a: servo.cap_b2, b: cap_ear_b2.seat, verify: {min_fraction: 0.7}}
    # ---- deck and electronics stack
    - {id: so_rl_bottom, a: chassis.so_rl, b: standoff_rl.bottom, fasteners: {type: M3x8}}
    - {id: so_rr_bottom, a: chassis.so_rr, b: standoff_rr.bottom, fasteners: {type: M3x8}}
    - {id: so_fl_bottom, a: chassis.so_fl, b: standoff_fl.bottom, fasteners: {type: M3x8}}
    - {id: so_fr_bottom, a: chassis.so_fr, b: standoff_fr.bottom, fasteners: {type: M3x8}}
    - {id: so_rl_top, a: standoff_rl.top, b: deck.so_rl, fasteners: {type: M3x8}}
    - {id: so_rr_top, a: standoff_rr.top, b: deck.so_rr, fasteners: {type: M3x8}}
    - {id: so_fl_top, a: standoff_fl.top, b: deck.so_fl, fasteners: {type: M3x8}}
    - {id: so_fr_top, a: standoff_fr.top, b: deck.so_fr, fasteners: {type: M3x8}}
    - {id: cap_so_rl, a: deck.cap_so_rl, b: cap_so_rl.seat}
    - {id: cap_so_rr, a: deck.cap_so_rr, b: cap_so_rr.seat}
    - {id: cap_so_fl, a: deck.cap_so_fl, b: cap_so_fl.seat}
    - {id: cap_so_fr, a: deck.cap_so_fr, b: cap_so_fr.seat}
    # Rigid mount at (155, 40, 113) mm, axes aligned with the chassis; no soft foam.
    - {id: imu_mount_bond, a: deck.imu_seat, b: imu_mount.bottom}
