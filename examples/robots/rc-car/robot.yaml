    - {id: motor_lead_post_mount, a: chassis.motor_lead_post, b: motor_lead_post.base, clock: 0 deg, fasteners: {type: M3x10}}
    - {id: cap_motor_lead_post, a: chassis.cap_motor_lead_post, b: cap_motor_lead_post.seat}
