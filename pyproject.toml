[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "r3-platform"
version = "0.1.0"
description = "R3 full-stack robotics platform: unified robot model, digital twin, and orchestration."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
sim = ["mujoco>=3.1", "scipy>=1.11", "matplotlib>=3.8", "pillow>=10"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
r3 = "r3_orchestrator.cli:main"

# Platform packages keep their reserved v1 folders. Each folder contains one
# importable Python package; `cicd/` remains a separate subsystem with its own
# configuration and is not part of this distribution.
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = [
    "packages/robot-model",
    "packages/component-catalog",
    "packages/wiring",
    "packages/simulation",
    "packages/hardware-interface",
    "integrations/onshape",
    "integrations/kicad",
    "integrations/github",
    "services/orchestrator",
    "services/simulation-worker",
]
include = ["r3_*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.fs", "*.json", "*.j2", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/robot-model",
    "packages/component-catalog",
    "packages/wiring",
    "packages/simulation",
    "packages/hardware-interface",
    "integrations/onshape",
    "integrations/kicad",
    "integrations/github",
    "services/orchestrator",
    "services/simulation-worker",
]
