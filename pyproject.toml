[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "r3-platform"
version = "0.1.0"
description = "R3 full-stack robotics platform: unified robot model, digital twin, and orchestration."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
sim = ["mujoco>=3.17", "scipy>=1.11", "matplotlib>=3.8", "pillow>=10"]
mcp = ["mcp>=1.2"]
models = ["cascadio>=0.1.1", "trimesh>=4", "rarfile>=4.2"]
# `r3 serve`: HTTP API (services/orchestrator/r3_orchestrator/api) and web app host.
api = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.2", "ruamel.yaml>=0.18"]
dev = ["pytest>=8", "httpx>=0.27"]
# `r3 source`: product-brief/drawing text (pypdf) and agent-output schema validation (jsonschema).
sourcing = ["pypdf>=4", "jsonschema>=4"]
# `fabrication` stage (3D printing): meshes, booleans, ray casts, 3MF export and scikit-fem strength checks.
fabrication = ["trimesh>=4", "manifold3d>=2.4", "rtree>=1.2", "networkx>=3", "lxml>=5", "scikit-fem>=10", "pyamg>=5"]

[project.scripts]
r3 = "r3_orchestrator.cli:main"

# Platform packages keep their reserved v1 folders. Each folder contains one
# importable Python package; `cicd/` remains a separate subsystem with its own
# configuration and is not part of this distribution.
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = [
    "packages/robot-model",
    "packages/component-catalog",
    "packages/wiring",
    "packages/connectors",
    "packages/fabrication",
    "packages/simulation",
    "packages/hardware-interface",
    "integrations/onshape",
    "integrations/kicad",
    "integrations/github",
    "services/orchestrator",
    "services/simulation-worker",
]
include = ["r3_*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.fs", "*.json", "*.j2", "*.md"]
"r3_catalog.modelbank" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the full RC-car wiring stage (run once per session by tests/conftest.py); deselect with -m 'not slow'",
]
pythonpath = [
    "packages/robot-model",
    "packages/component-catalog",
    "packages/wiring",
    "packages/connectors",
    "packages/fabrication",
    "packages/simulation",
    "packages/hardware-interface",
    "integrations/onshape",
    "integrations/kicad",
    "integrations/github",
    "services/orchestrator",
    "services/simulation-worker",
]
