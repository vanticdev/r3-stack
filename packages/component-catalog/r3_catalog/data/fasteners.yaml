# Purchased fasteners, ISO metric coarse threads. Dimensions are nominal (maximum
# head sizes). minor_diameter is the internal-thread minor diameter
# D1 = d - 1.0825 P (ISO 724). tap_drill is the standard tap drill (ISO 2306,
# about 75 % thread engagement); Onshape's ISO tapped-hole table uses the same
# value, so tapped holes are modeled at tap_drill and the screw/part
# intersection volume is pi/4 (d^2 - tap_drill^2) x engagement length.
# Clearance holes: ISO 273 fine (close) / medium (normal) / coarse series.
fasteners:
  - id: shcs-m2
    kind: socket_head_screw
    name: Socket head cap screw M2, steel 12.9
    standard: ISO 4762
    thread: M2
    d: 2.0 mm
    pitch: 0.4 mm
    minor_diameter: 1.567 mm
    tap_drill: 1.6 mm
    head_diameter: 3.8 mm
    head_height: 2.0 mm
    lengths: [3 mm, 4 mm, 5 mm, 6 mm, 8 mm, 10 mm, 12 mm, 16 mm, 20 mm]
    clearance_close: 2.2 mm
    clearance_normal: 2.4 mm
    clearance_coarse: 2.6 mm
    provenance: {status: datasheet, source: "ISO 4762:2004 table 1 (dk max 3.8, k max 2.0); ISO 724 (D1); ISO 2306 (tap drill); ISO 273"}
  - id: shcs-m2.5
