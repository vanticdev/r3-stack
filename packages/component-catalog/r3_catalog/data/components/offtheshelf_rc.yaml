           profile: [[0, -10 mm], [2.5 mm, -10 mm], [2.5 mm, 0], [4 mm, 0], [4 mm, 92 mm], [2.5 mm, 92 mm], [2.5 mm, 96 mm],
                     [4 mm, 96 mm], [4 mm, 104 mm], [6.93 mm, 104 mm], [6.93 mm, 114 mm], [2 mm, 114 mm], [2 mm, 122 mm], [0, 122 mm]]}
        - {kind: box, op: remove, name: output flat, position: [0, -5 mm, 3 mm], size: [6 mm, 10.2 mm, 2 mm]}
        - {kind: box, op: remove, name: hex flat, position: [0, 109 mm, 7 mm], size: [15 mm, 10.2 mm, 2 mm]}
      provenance: {status: estimated, source: "Traxxas 6852X/2753X (parts list 58234-8); stub axle 42 mm long, 13 mm max dia (vendor); lengths estimated"}
    interfaces:
      output: {kind: shaft, origin: [0, 0, 0], z: [0, -1, 0], x: [0, 0, 1], params: {d: 5.0 mm, length: 10 mm, flat_offset: 2.0 mm}}
      bearing_seat: {kind: shaft, origin: [0, 92 mm, 0], z: [0, 1, 0], x: [0, 0, 1], params: {d: 5.0 mm, length: 4 mm}}
      hex: {kind: shaft, origin: [0, 104 mm, 0], z: [0, 1, 0], x: [0, 0, 1], params: {d: 13.86 mm, length: 10 mm, flat_offset: 6.0 mm},
            description: "12 mm hex modelled as a flat at 6 mm (across flats / 2); 13.86 mm across corners"}
      nut_thread: {kind: hole_pattern, origin: [0, 114 mm, 0], z: [0, 1, 0], x: [1, 0, 0], params: {holes: [[0, 0, 4 mm, thread, 8 mm]]}}
