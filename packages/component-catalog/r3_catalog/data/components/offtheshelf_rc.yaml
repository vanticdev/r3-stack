      bearing journal (5 x 11 x 4 bearing in a printed carrier) at 92-96 mm; 12 mm hex at 104-114 mm (wheel hub face
      at the hex shoulder); M4 stud for the wheel nut. With the left output at y = +38 mm the wheel centre lands at the
      Slash track (296 mm). LENGTHS ARE ESTIMATES (Traxxas publishes none): measure.
    mechanical:
      shape: custom
      size: [13.9 mm, 132 mm, 13.9 mm]
      mass: 0.045
      material: Steel
      color: "#8d939a"
      moving: true
      solids:
