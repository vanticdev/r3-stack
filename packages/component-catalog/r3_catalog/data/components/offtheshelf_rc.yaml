# Off-the-shelf components, with supplier data and explicitly labelled geometry estimates.
# Geometry honesty: Traxxas publishes no drawings or CAD for the Magnum 272 transmission, the driveshafts or
# the wheel hubs. Those envelopes and interface positions are ESTIMATES laid out for the Slash 2WD geometry
# (296 mm track, 335 mm wheelbase, 2.2/3.0 in SCT wheels) and are labelled `estimated`; measure the bought
# parts and override them in the project's catalog/ before printing. Electrical and drive data are
# datasheet values where published.
#
# Frames follow the catalog convention (boxes: bottom-face centre; x/y-axis cylinders: body centre).
# Drive axes run along y (left = +y). Interfaces: shafts/bores z points out of the part along the axis.
components:
  # ------------------------------------------------------------------ transmission + motor
  - id: traxxas-3695-magnum-272
    kind: gearbox
    cad_name: Traxxas Magnum 272
    name: Traxxas Pro-Built Magnum 272 transmission (2WD, planetary differential, slipper clutch), 23T/86T 48P
    manufacturer: Traxxas
    part_number: "3695"
    description: >
      Frame at the bottom centre of the case, outputs along y at 30 mm height (left output face y = +38 mm, right
      output through the gear cover at y = -50 mm). Motor plate on the right (-y) side: the 550 motor sits on the
      inner (+y) side of the plate, 28.84 mm ahead of the spur axis (23T/86T 48P centre distance), with the pinion
      and spur inside the gear cover. Final ratio 86/23 x 2.72 = 10.17. In production as 9495 (Magnum 272R).
      ENVELOPE, MOUNT HOLES AND OUTPUT POSITIONS ARE ESTIMATES (no Traxxas drawing): measure before printing.
    mechanical:
      shape: custom
      size: [100 mm, 88 mm, 64 mm]
      mass: 0.26
      material: Glass-filled nylon case, steel gears
      color: "#2b2d31"
      moving: true
      solids:
        - {kind: box, name: case, position: [0, 0, 32 mm], size: [60 mm, 76 mm, 64 mm]}
        - {kind: box, name: motor plate, position: [20 mm, -36.5 mm, 30 mm], size: [100 mm, 3 mm, 60 mm]}
        - {kind: box, name: gear cover, position: [34 mm, -44 mm, 30 mm], size: [72 mm, 12 mm, 56 mm]}
      features:
        - {id: output_left, kind: d_bore, position: [0, 38 mm, 30 mm], axis: [0, -1, 0], diameter: 5.05 mm, depth: 10 mm,
           flat_offset: 2.05 mm, flat_normal: [0, 0, 1], provenance: {status: estimated, source: "4628R output yoke socket (cross-pin drive modelled as a flat)"}}
        - {id: output_right, kind: d_bore, position: [0, -50 mm, 30 mm], axis: [0, 1, 0], diameter: 5.05 mm, depth: 10 mm,
           flat_offset: 2.05 mm, flat_normal: [0, 0, 1], provenance: {status: estimated, source: "4628R output yoke socket through the gear cover"}}
        - {id: motor_axis, kind: bore, position: [50.84 mm, -35 mm, 30 mm], axis: [0, -1, 0], diameter: 8 mm, depth: 15 mm,
           provenance: {status: estimated, source: "Motor plate bore and the pinion space in the gear cover"}}
        - {id: motor_hole_a, kind: clearance_hole, position: [63.34 mm, -35 mm, 30 mm], axis: [0, -1, 0], diameter: 3.4 mm, depth: 3 mm}
        - {id: motor_hole_b, kind: clearance_hole, position: [38.34 mm, -35 mm, 30 mm], axis: [0, -1, 0], diameter: 3.4 mm, depth: 3 mm}
        - {id: motor_face, kind: face, position: [50.84 mm, -35 mm, 30 mm], axis: [0, 1, 0]}
        - {id: screw_access_a, kind: bore, position: [63.34 mm, -50 mm, 30 mm], axis: [0, 1, 0], diameter: 6.5 mm, depth: 12 mm,
           provenance: {status: estimated, source: "Motor screw access through the gear cover (the 550 is fixed from the cover side)"}}
        - {id: screw_access_b, kind: bore, position: [38.34 mm, -50 mm, 30 mm], axis: [0, 1, 0], diameter: 6.5 mm, depth: 12 mm}
        - {id: mount_1, kind: tapped_hole, position: [20 mm, 25 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: mount_2, kind: tapped_hole, position: [-20 mm, 25 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: mount_3, kind: tapped_hole, position: [20 mm, -25 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: mount_4, kind: tapped_hole, position: [-20 mm, -25 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
      provenance: {status: estimated, source: "Envelope estimated for the Slash 2WD layout; https://traxxas.com/products/parts/3695 (no drawing published)"}
    interfaces:
      mount: {kind: hole_pattern, origin: [0, 0, 0], z: [0, 0, -1], x: [1, 0, 0],
              params: {holes: [[20 mm, 25 mm, 3 mm, tapped, 8 mm], [-20 mm, 25 mm, 3 mm, tapped, 8 mm],
                               [20 mm, -25 mm, 3 mm, tapped, 8 mm], [-20 mm, -25 mm, 3 mm, tapped, 8 mm]]},
              description: "Case bottom, 4x M3 (ESTIMATED pattern 40 x 50 mm; measure the case)"}
      motor_mount: {kind: hole_pattern, origin: [50.84 mm, -35 mm, 30 mm], z: [0, 1, 0], x: [1, 0, 0],
                    params: {holes: [[12.5 mm, 0, 3.4 mm, clearance, 3 mm], [-12.5 mm, 0, 3.4 mm, clearance, 3 mm]]},
                    description: "540/550 motor plate: 2x M3 on 25 mm centres (inner face of the plate)"}
      pinion: {kind: bore, origin: [50.84 mm, -35 mm, 30 mm], z: [0, 1, 0], x: [0, 0, 1], params: {d: 3.0 mm, depth: 12 mm, flat_offset: 1.25 mm},
               description: "Traxxas 2423 23T 48P pinion bore (3 mm shaft, set screw on the flat)"}
      output_l: {kind: bore, origin: [0, 38 mm, 30 mm], z: [0, 1, 0], x: [0, 0, 1], params: {d: 5.05 mm, depth: 10 mm, flat_offset: 2.05 mm},
                 description: "Left output yoke 4628R; the cross-pin drive is modelled as a flat (estimated)"}
      output_r: {kind: bore, origin: [0, -50 mm, 30 mm], z: [0, -1, 0], x: [0, 0, 1], params: {d: 5.05 mm, depth: 10 mm, flat_offset: 2.05 mm},
                 description: "Right output yoke through the gear cover (estimated)"}
    behavior:
      model: gearbox.differential
      params: {ratio: 10.17, efficiency: 0.85, backlash: 0.03, output_inertia: 6.0e-5, pinion_teeth: 23, spur_teeth: 86,
               diametral_pitch: 48, module: 0.529 mm, center_distance: 28.84 mm, internal_ratio: 2.72}
      provenance:
        status: datasheet
        source: "Traxxas 58234-8 Slash 2WD: internal ratio 2.72, 48P; owner's manual gear chart 23/86 = 10.17 (https://traxxas.com/media/productattach/C-58234-8/2/58234-8-om-en-r00.pdf)"
        notes: "efficiency, backlash and output inertia are estimates"
    provenance: {status: datasheet, source: "https://traxxas.com/products/parts/3695"}

  - id: traxxas-3785-titan-12t-550
    kind: motor
    cad_name: Traxxas Titan 12T 550
    name: Traxxas Titan 12T 550 brushed motor, 3 mm shaft, integrated fan
    manufacturer: Traxxas
    part_number: "3785"
    description: Frame at the can centre, axis y; the output face (shaft, mount holes) is at local y = -28.5 mm.
    mechanical:
      shape: cylinder
      axis: y
      size: [36 mm, 57 mm]
      mass: 0.24
      material: Steel can
      color: "#3c4148"
      moving: true
      features:
        - {id: shaft, kind: d_shaft, position: [0, -28.5 mm, 0], axis: [0, -1, 0], diameter: 3.0 mm, depth: 12 mm, flat_offset: 1.25 mm,
           flat_normal: [0, 0, 1], provenance: {status: datasheet, source: "Traxxas: 3 mm shaft (pinion 2423 fits 3 mm); exposed length and set-screw flat estimated"}}
        - {id: mount_a, kind: tapped_hole, position: [12.5 mm, -28.5 mm, 0], axis: [0, 1, 0], depth: 5 mm, thread: shcs-m3,
           provenance: {status: estimated, source: "550 cans share the 540 face: 2x M3 on 25 mm centres (Mabuchi RS-540 drawing); measure"}}
        - {id: mount_b, kind: tapped_hole, position: [-12.5 mm, -28.5 mm, 0], axis: [0, 1, 0], depth: 5 mm, thread: shcs-m3}
        - {id: face, kind: face, position: [0, -28.5 mm, 0], axis: [0, -1, 0]}
      provenance: {status: datasheet, source: "https://traxxas.com/58234-8-slash-2wd-xl-5-wbattery: 36 mm dia, 57 mm can, 78 mm overall, 240 g"}
    interfaces:
      face: {kind: hole_pattern, origin: [0, -28.5 mm, 0], z: [0, -1, 0], x: [1, 0, 0], params: {holes: [[12.5 mm, 0, 3 mm, tapped, 5 mm], [-12.5 mm, 0, 3 mm, tapped, 5 mm]]}}
      shaft: {kind: shaft, origin: [0, -28.5 mm, 0], z: [0, -1, 0], x: [0, 0, 1], params: {d: 3.0 mm, length: 12 mm, flat_offset: 1.25 mm}}
    pins:
      M_POS: {role: motor, voltage_max: 8.4, current_max: 60}
      M_NEG: {role: motor, voltage_max: 8.4, current_max: 60}
    connectors:
      J_POS: {type: integral, position: [0, 28.5 mm, 10 mm], direction: [0, 1, 0], pins: {"1": M_POS}}
      J_NEG: {type: integral, position: [0, 28.5 mm, -10 mm], direction: [0, 1, 0], pins: {"1": M_NEG}}
    behavior:
      model: motor.dc_brushed
      params: {kv_rpm_per_v: 2600, resistance: 0.07, inductance: 40 uH, no_load_current: 2.0, rotor_inertia: 1.6e-5, brush_drop: 0.2, max_rpm: 24000}
      provenance: {status: estimated, source: "Traxxas publishes no Kv, resistance or currents for the Titan 12T; typical 12T 550 values (dyno it)",
                   notes: "Hobbywing 1060 limit on 2S: 540/550 >= 12T, so this motor is at the ESC's limit"}
    thermal: {theta_ja_c_per_w: 2.5, max_temp_c: 100}

  # ------------------------------------------------------------------ rear driveline (driveshaft + stub axle + 12 mm hex hub)
