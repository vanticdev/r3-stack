      spur_shaft: {kind: shaft, origin: [29.93 mm, -45 mm, 34 mm], z: [0, -1, 0], x: [1, 0, 0], params: {d: 5 mm, length: 8 mm}, description: "Spur-gear shaft extension through the gear cover: turns at 2.4727 x the differential carrier"}
      encoder: {kind: hole_pattern, origin: [29.93 mm, -45 mm, 20 mm], z: [0, -1, 0], x: [1, 0, 0], params: {holes: [[3.5 mm, 0, 2 mm, tapped, 10 mm], [-3.5 mm, 0, 2 mm, tapped, 10 mm]]}}
      # Flat case lid (55 x 60.5 mm), the highest clear surface at the rear: open sky for a GNSS antenna.
      lid_pad: {kind: adhesive_pad, origin: [2.5 mm, -0.25 mm, 60 mm], z: [0, 0, 1], x: [1, 0, 0]}
    behavior:
      model: gearbox.differential
      params: {ratio: 9.066, efficiency: 0.88, backlash: 0.02, output_inertia: 4.0e-5, pinion_teeth: 18, spur_teeth: 66, module: 0.6 mm,
               center_distance: 25.2 mm, internal_ratio: 2.4727}
