      path: rpi-5b_no_graphics.step
      sha256: 6841637b4cfa97637bf34b529bfe896f24d9634b2c40b57a156781f55d88f06f
      license: "MIT (Copyright (c) 2026 Raspberry Pi Ltd; LICENSE.txt in the archive). Provided for guidance only, without guarantee of accuracy."
