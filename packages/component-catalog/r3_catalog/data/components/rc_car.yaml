  - id: r3-carrier-hat
    kind: pcb
    cad_name: R3 carrier HAT
    name: R3 RC carrier HAT (custom KiCad board)
    description: >
      65 x 56.5 mm HAT made headlessly in KiCad 10. XT30 battery input -> DMP3013SFV reverse-polarity FET ->
      2 mOhm Kelvin shunt (INA226, I2C 0x40, HAT branch only) -> TPS568230 5.1 V / 5 A buck back-powering the Pi
      (VIN UVLO 4.4 V max, 220 uF hold-up) and TPS56528 6.0 V servo rail (5.5-7.8 A valley current limit);
      SMAJ10A input TVS (17.0 V clamp, below the regulators' 20 V VIN absolute maximum); MPU-6050 IMU (I2C 0x68);
      ATtiny412 failsafe arbiter between the Pi's ESC PWM and the ESC (neutral after 100 ms without a GPIO27
      heartbeat); 220 Ohm series resistor on the servo PWM; encoder pull-up. The ESC BEC (J_ESC.2) is not connected.
