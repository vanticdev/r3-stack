        - {kind: box, name: usb ethernet, position: [33.75 mm, 0, 9.6 mm], size: [21.5 mm, 53 mm, 16 mm]}
        - {kind: box, name: gpio header base, position: [-10 mm, 24.5 mm, 2.85 mm], size: [50.8 mm, 5.08 mm, 2.5 mm]}
        - {kind: box, name: gpio pins, position: [-10 mm, 24.5 mm, 7.1 mm], size: [50.4 mm, 4.7 mm, 6 mm]}
      features:
        - {id: hole_1, kind: clearance_hole, position: [-39 mm, -24.5 mm, 1.6 mm], axis: [0, 0, -1], diameter: 2.7 mm, depth: 1.6 mm}
        - {id: hole_2, kind: clearance_hole, position: [19 mm, -24.5 mm, 1.6 mm], axis: [0, 0, -1], diameter: 2.7 mm, depth: 1.6 mm}
        - {id: hole_3, kind: clearance_hole, position: [-39 mm, 24.5 mm, 1.6 mm], axis: [0, 0, -1], diameter: 2.7 mm, depth: 1.6 mm}
        - {id: hole_4, kind: clearance_hole, position: [19 mm, 24.5 mm, 1.6 mm], axis: [0, 0, -1], diameter: 2.7 mm, depth: 1.6 mm}
