# Components used by the reference RC car. Component frame: origin at the
# center of the bottom (mounting) face, +z away from the mount, box sizes are
# full extents centered at (0, 0, size_z / 2). Connector positions are in the
# component frame. Cylinders are centered on their axis at mid-length.
components:
  - id: chassis-plate-al6061
    kind: structure
    cad_name: Chassis plate
    name: Main chassis plate, 6061-T6 aluminum, 3 mm
    description: Waterjet plate; rear section 130 mm wide, front tapers to 70 mm for steering sweep.
    mechanical:
      shape: custom
      size: [340 mm, 130 mm, 3 mm]
      mass: 0.33
      material: Aluminum 6061-T6
      density: 2700
      color: "#b8bcc2"
      fabricated: true
      # Waterjet outline from the instance params; holes and slots come from the
      # fasteners and straps that use the plate.
      solids:
        - {kind: prism, name: plate, position: [0, 0, 0], axis: [0, 0, 1], u_axis: [1, 0, 0], depth: 3 mm, profile: "@outline"}
        # Relief under the 540 can: with the 18T pinion the motor sits 0.2 mm lower (center distance 25.2 mm).
        - {kind: box, op: remove, name: motor relief, position: [-80.76 mm, -5 mm, 1.5 mm], size: [38 mm, 52 mm, 3 mm]}
      provenance: {status: estimated, notes: "mass replaced by CAD mass properties after cad sync"}
    interfaces:
    # Interface frames in the plate frame (bottom center; top face z = 3 mm). Holes and slots of this
    # fabricated plate are cut from these interfaces; joins in robot.yaml place every object on them.
      gearbox: {kind: hole_pattern, origin: [-130 mm, 0, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[18 mm, 22 mm, 3.4 mm, clearance, 3 mm], [-18 mm, 22 mm, 3.4 mm, clearance, 3 mm], [18 mm, -22 mm, 3.4 mm, clearance, 3 mm], [-18 mm, -22 mm, 3.4 mm, clearance, 3 mm]]}}
      hub_rl: {kind: hole_pattern, origin: [-130 mm, 53 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[7 mm, 6 mm, 3.4 mm, clearance, 3 mm], [-7 mm, 6 mm, 3.4 mm, clearance, 3 mm], [7 mm, -6 mm, 3.4 mm, clearance, 3 mm], [-7 mm, -6 mm, 3.4 mm, clearance, 3 mm]]}}
      hub_rr: {kind: hole_pattern, origin: [-130 mm, -53 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[7 mm, 6 mm, 3.4 mm, clearance, 3 mm], [-7 mm, 6 mm, 3.4 mm, clearance, 3 mm], [7 mm, -6 mm, 3.4 mm, clearance, 3 mm], [-7 mm, -6 mm, 3.4 mm, clearance, 3 mm]]}}
      # so_rl sits behind the motor's bullet terminals, out of the motor-lead corridor (x 40-100 mm, y 37-60 mm robot frame).
      so_rl: {kind: hole_pattern, origin: [-99 mm, 47 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      so_rr: {kind: hole_pattern, origin: [-52 mm, -45 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      so_fl: {kind: hole_pattern, origin: [65 mm, 28 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      so_fr: {kind: hole_pattern, origin: [65 mm, -28 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      arm_fl: {kind: hole_pattern, origin: [130 mm, 31 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 4 mm, 3.4 mm, clearance, 3 mm], [0, -4 mm, 3.4 mm, clearance, 3 mm]]}}
      arm_fr: {kind: hole_pattern, origin: [130 mm, -31 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 4 mm, 3.4 mm, clearance, 3 mm], [0, -4 mm, 3.4 mm, clearance, 3 mm]]}}
      post_a: {kind: hole_pattern, origin: [110.05 mm, 0, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 5 mm, 3.4 mm, clearance, 3 mm], [0, -5 mm, 3.4 mm, clearance, 3 mm]]}}
      post_b: {kind: hole_pattern, origin: [159.55 mm, 0, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 5 mm, 3.4 mm, clearance, 3 mm], [0, -5 mm, 3.4 mm, clearance, 3 mm]]}}
      # ESC beside the battery (left), clear of the motor's bullet terminals, which point +y off the end bell.
      esc_pad: {kind: adhesive_pad, origin: [-7 mm, 47 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {area: 1408 mm^2}}
      # Battery 17 mm aft of the servo posts' line: its 12 AWG lead (16 mm bend radius) turns back clear of post A.
      battery_seat: {kind: face_mount, origin: [11 mm, 0, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      strap_slots: {kind: strap_slot, origin: [11 mm, 0, 0], z: [0, 0, -1], x: [1, 0, 0], params: {width: 22 mm, slots: [[-11 mm, -25.5 mm, 11 mm, -23 mm], [-11 mm, 23 mm, 11 mm, 25.5 mm]]}, description: "Two 22 x 2.5 mm slots either side of the battery for the hook-and-loop strap"}
      # Fuse holder on the right of the battery, along x: input (J1) forward from the splices, output (J2) aft,
      # turning back under the deck to the HAT feed slot.
      fuse_seat: {kind: face_mount, origin: [26 mm, -37 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      tie_slots: {kind: strap_slot, origin: [26 mm, -37 mm, 0], z: [0, 0, -1], x: [0, -1, 0], params: {width: 4 mm, slots: [[-7.5 mm, -2 mm, -5.5 mm, 2 mm], [5.5 mm, -2 mm, 7.5 mm, 2 mm]]}, description: "Cable-tie slots that retain the fuse holder"}
  - id: upper-deck-petg
    kind: structure
    cad_name: Electronics deck
    name: Electronics deck, PETG 3D printed, 3 mm
    mechanical:
      shape: custom
      size: [170 mm, 110 mm, 3 mm]
      mass: 0.065
      material: PETG
      density: 1270
      color: "#2c6e9e"
      fabricated: true
      solids:
        - {kind: prism, name: deck, position: [0, 0, 0], axis: [0, 0, 1], u_axis: [1, 0, 0], depth: 3 mm, profile: "@outline"}
      features:
        # Lead slot (grommet edge strip) beside the HAT's top-entry ESC/servo headers: the leads run under the deck
        # and come up next to the HAT instead of looping around the deck edge.
        - {id: lead_slot, kind: slot, position: [-22 mm, -42 mm, 3 mm], axis: [0, 0, -1], diameter: 9 mm, length: 14 mm,
           slot_dir: [1, 0, 0], depth: 3 mm, provenance: {status: estimated, source: "R3 deck layout"}}
        # HAT power feed: the fused 18 AWG pair comes up between the Pi's USB end and the antenna mast, in line
        # with the HAT's XT30 input.
        - {id: power_slot, kind: slot, position: [48 mm, -22 mm, 3 mm], axis: [0, 0, -1], diameter: 10 mm, length: 6 mm,
           slot_dir: [1, 0, 0], depth: 3 mm, provenance: {status: estimated, source: "R3 deck layout"}}
    interfaces:
    # Deck frame: bottom center; top face z = 3 mm. PETG: hole clearances from the FDM print-fit table.
      so_rl: {kind: hole_pattern, origin: [-89 mm, 47 mm, 0], z: [0, 0, -1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      so_rr: {kind: hole_pattern, origin: [-42 mm, -45 mm, 0], z: [0, 0, -1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      so_fl: {kind: hole_pattern, origin: [75 mm, 28 mm, 0], z: [0, 0, -1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      so_fr: {kind: hole_pattern, origin: [75 mm, -28 mm, 0], z: [0, 0, -1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      cap_so_rl: {kind: adhesive_pad, origin: [-89 mm, 47 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      cap_so_rr: {kind: adhesive_pad, origin: [-42 mm, -45 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      cap_so_fl: {kind: adhesive_pad, origin: [75 mm, 28 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      cap_so_fr: {kind: adhesive_pad, origin: [75 mm, -28 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      pi_1: {kind: hole_pattern, origin: [-49 mm, -24.5 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 2.9 mm, clearance, 3 mm]]}}
      pi_2: {kind: hole_pattern, origin: [9 mm, -24.5 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 2.9 mm, clearance, 3 mm]]}}
      pi_3: {kind: hole_pattern, origin: [-49 mm, 24.5 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 2.9 mm, clearance, 3 mm]]}}
      pi_4: {kind: hole_pattern, origin: [9 mm, 24.5 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 2.9 mm, clearance, 3 mm]]}}
      rx_pad: {kind: adhesive_pad, origin: [70 mm, 40 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      gps_pad: {kind: adhesive_pad, origin: [-65 mm, 30 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0]}
      lead_post: {kind: hole_pattern, origin: [-22 mm, -51.5 mm, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3.4 mm, clearance, 3 mm]]}}
      mast: {kind: hole_pattern, origin: [55 mm, 0, 3 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[7 mm, 0, 3.4 mm, clearance, 3 mm], [-7 mm, 0, 3.4 mm, clearance, 3 mm]]}}
  - id: standoff-m3-47
    kind: structure
    cad_name: Deck standoff M3x47
    name: M3 x 47 mm aluminum standoff, female-female
    mechanical:
      shape: cylinder
      axis: z
      size: [5.5 mm, 47 mm]
      mass: 0.0028
      material: Aluminum 6061-T6
      density: 2700
      features:
        - {id: thread_bottom, kind: tapped_hole, position: [0, 0, 0], axis: [0, 0, 1], depth: 6 mm, thread: shcs-m3}
        - {id: thread_top, kind: tapped_hole, position: [0, 0, 47 mm], axis: [0, 0, -1], depth: 6 mm, thread: shcs-m3}
      provenance: {status: estimated, source: "Typical M3 F-F round standoff, 6 mm thread depth each end"}
    interfaces:
      bottom: {kind: hole_pattern, origin: [0, 0, 0], z: [0, 0, -1], x: [1, 0, 0], params: {holes: [[0, 0, 3 mm, tapped, 6 mm]]}}
      top: {kind: hole_pattern, origin: [0, 0, 47 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3 mm, tapped, 6 mm]]}}
  - id: wheel-110x45
    kind: wheel
    cad_name: Front wheel
    cad_family: Wheels
    name: 1/10 scale wheel and foam-insert rubber tire, 110 x 45 mm, front (plain 6.05 mm hub bore)
    description: Component frame at the wheel center, axis +y toward the outer (nut) side; the hub recess faces -y.
    mechanical:
      shape: cylinder
      axis: y
      size: [110 mm, 45 mm]
      mass: 0.085
      material: Rubber over nylon rim
      color: "#222222"
      moving: true
      keepout_margin: 4 mm
      solids:
        - {kind: cylinder, name: tire, position: [0, -22.5 mm, 0], axis: [0, 1, 0], diameter: 110 mm, length: 45 mm}
      features:
        - {id: hub_recess, kind: bore, position: [0, -22.5 mm, 0], axis: [0, 1, 0], diameter: 64 mm, depth: 14 mm,
           provenance: {status: estimated, source: "1/10 rim with 14 mm hub offset (inner side)"}}
        - {id: nut_seat, kind: bore, position: [0, 22.5 mm, 0], axis: [0, -1, 0], diameter: 14 mm, depth: 8 mm,
           provenance: {status: estimated, source: "Outer nut recess for an M6 nyloc"}}
        - {id: hub_face, kind: face, position: [0, -8.5 mm, 0], axis: [0, -1, 0]}
        - {id: nut_face, kind: face, position: [0, 14.5 mm, 0], axis: [0, 1, 0]}
        - {id: hub_bore, kind: bore, position: [0, -8.5 mm, 0], axis: [0, 1, 0], diameter: 6.05 mm, depth: 23 mm,
           provenance: {status: estimated, source: "Plain nylon hub bore, H9-class running clearance on a 6 mm stub axle"}}
    interfaces:
      hub: {kind: bore, origin: [0, -8.5 mm, 0], z: [0, -1, 0], x: [0, 0, 1], params: {d: 6.05 mm, depth: 23 mm}, description: "Plain nylon hub bore, opening on the inner hub face"}
    behavior:
      model: tire.linear
      params: {radius: 0.055, width: 0.045, friction: 0.9, rolling_resistance: 0.015, torsional_friction: 0.005}
  - id: wheel-110x45-d
    kind: wheel
    cad_name: Rear wheel
    cad_family: Wheels
    name: 1/10 scale wheel and foam-insert rubber tire, 110 x 45 mm, rear (6 mm D-bore drive hub)
    description: Component frame at the wheel center, axis +y toward the outer (nut) side; the hub recess faces -y.
    mechanical:
      shape: cylinder
      axis: y
      size: [110 mm, 45 mm]
      mass: 0.085
      material: Rubber over nylon rim
      color: "#222222"
      moving: true
      keepout_margin: 4 mm
      solids:
        - {kind: cylinder, name: tire, position: [0, -22.5 mm, 0], axis: [0, 1, 0], diameter: 110 mm, length: 45 mm}
      features:
        - {id: hub_recess, kind: bore, position: [0, -22.5 mm, 0], axis: [0, 1, 0], diameter: 64 mm, depth: 14 mm,
           provenance: {status: estimated, source: "1/10 rim with 14 mm hub offset (inner side)"}}
        - {id: nut_seat, kind: bore, position: [0, 22.5 mm, 0], axis: [0, -1, 0], diameter: 14 mm, depth: 8 mm,
           provenance: {status: estimated, source: "Outer nut recess for an M6 nyloc"}}
        - {id: hub_face, kind: face, position: [0, -8.5 mm, 0], axis: [0, -1, 0]}
        - {id: nut_face, kind: face, position: [0, 14.5 mm, 0], axis: [0, 1, 0]}
        - {id: hub_dbore, kind: d_bore, position: [0, -8.5 mm, 0], axis: [0, 1, 0], diameter: 6.02 mm, depth: 23 mm,
           flat_offset: 2.51 mm, flat_normal: [0, 0, 1], provenance: {status: estimated, source: "Molded 6 mm D-drive hub"}}
    interfaces:
      hub: {kind: bore, origin: [0, -8.5 mm, 0], z: [0, -1, 0], x: [0, 0, 1], params: {d: 6.02 mm, depth: 23 mm, flat_offset: 2.51 mm}, description: "6 mm D-drive hub; flat on +x of the frame"}
    behavior:
      model: tire.linear
      params: {radius: 0.055, width: 0.045, friction: 0.9, rolling_resistance: 0.015, torsional_friction: 0.005}
  - id: steering-knuckle
    kind: structure
    cad_name: Steering knuckle
    name: Steering knuckle with integral steering arm, PA12 SLS (left hand; mirror for right)
    description: >
      Frame on the kingpin axis at the knuckle's bottom (thrust) face. Kingpin boss, an upright that carries the
      press-fit stub axle inside the wheel's hub recess, and a steering arm whose ball stud sits 25 mm straight
      behind the kingpin (parallel arms; the servo horn geometry provides the Ackermann).
    mechanical:
      shape: custom
      size: [40 mm, 30 mm, 40.5 mm]
      mass: 0.018
      material: Nylon PA12
      density: 1010
      color: "#3b3f45"
      fabricated: true
      solids:
        - {kind: box, name: kingpin boss, position: [0, 0, 6 mm], size: [16 mm, 13 mm, 12 mm]}
        - {kind: box, name: upright, position: [0, 14 mm, 20.25 mm], size: [16 mm, 15 mm, 40.5 mm]}
        - {kind: prism, name: steering arm, position: [0, 0, 31.5 mm], axis: [0, 0, 1], u_axis: [1, 0, 0], depth: 9 mm,
           profile: [[-2.93 mm, 17.34 mm], [1.43 mm, 9.46 mm], [-26.76 mm, -6.12 mm], [-31.12 mm, 1.76 mm]]}
    interfaces:
      kingpin: {kind: bore, origin: [0, 0, 0], z: [0, 0, -1], x: [1, 0, 0], params: {d: 3.2 mm, depth: 12 mm}, description: "Kingpin bore through the boss; thrust face on the arm"}
      stub: {kind: bore, origin: [0, 21.5 mm, 19 mm], z: [0, 1, 0], x: [1, 0, 0], params: {d: 5.95 mm, depth: 10 mm}, description: "Stub-axle press bore in the upright (SLS press fit)"}
      ball_stud: {kind: hole_pattern, origin: [-25 mm, 0, 40.5 mm], z: [0, 0, 1], x: [1, 0, 0], params: {holes: [[0, 0, 3 mm, tapped, 9 mm]]}}
  - id: motor-540-brushed
    kind: motor
    cad_name: Motor 540
    name: 540-size brushed DC motor, 20T
    description: Frame at the can center, axis y; the output face (shaft, mount holes) is at local y = -25 mm, terminals on the rear end bell.
    mechanical:
      shape: cylinder
      axis: y
      size: [36 mm, 50 mm]
      mass: 0.165
      material: Steel can
      color: "#555b61"
      moving: true
      features:
        - {id: shaft, kind: d_shaft, position: [0, -25 mm, 0], axis: [0, -1, 0], diameter: 3.17 mm, depth: 12 mm, flat_offset: 1.385 mm,
           flat_normal: [0, 0, 1], provenance: {status: datasheet, source: "540 can: 3.175 mm (1/8 in) shaft, ~12 mm exposed; flat filed for the pinion set screw"}}
        - {id: mount_a, kind: tapped_hole, position: [12.5 mm, -25 mm, 0], axis: [0, 1, 0], depth: 6 mm, thread: shcs-m3,
           provenance: {status: datasheet, source: "540 can: 2x M3 face holes on 25 mm centers"}}
        - {id: mount_b, kind: tapped_hole, position: [-12.5 mm, -25 mm, 0], axis: [0, 1, 0], depth: 6 mm, thread: shcs-m3}
        - {id: face, kind: face, position: [0, -25 mm, 0], axis: [0, -1, 0]}
    interfaces:
      face: {kind: hole_pattern, origin: [0, -25 mm, 0], z: [0, -1, 0], x: [1, 0, 0], params: {holes: [[12.5 mm, 0, 3 mm, tapped, 6 mm], [-12.5 mm, 0, 3 mm, tapped, 6 mm]]}}
      shaft: {kind: shaft, origin: [0, -25 mm, 0], z: [0, -1, 0], x: [0, 0, 1], params: {d: 3.17 mm, length: 12 mm, flat_offset: 1.385 mm}}
    pins:
      M_POS: {role: motor, voltage_max: 8.4, current_max: 70}
      M_NEG: {role: motor, voltage_max: 8.4, current_max: 70}
    connectors:
      J_POS: {type: bullet-3.5-male, position: [0, 26 mm, 10 mm], direction: [0, 1, 0], pins: {"1": M_POS}}
      J_NEG: {type: bullet-3.5-male, position: [0, 26 mm, -10 mm], direction: [0, 1, 0], pins: {"1": M_NEG}}
    behavior:
      model: motor.dc_brushed
      params: {kv_rpm_per_v: 2100, resistance: 0.11, inductance: 60 uH, no_load_current: 1.6, rotor_inertia: 1.2e-5, brush_drop: 0.2, max_rpm: 21000}
      provenance: {status: estimated, notes: "Typical 540 20T values; replace with dynamometer data"}
    thermal: {theta_ja_c_per_w: 2.5, max_temp_c: 100}
  - id: gearbox-spur-diff
    kind: gearbox
    cad_name: Rear transmission
    name: Rear transmission, 18T/66T m0.6 spur + internal reduction + open differential, 9.07:1 total
    description: >
      Frame at the bottom center of the case. Case body, a motor plate on the -y side and a gear cover outboard of it
      enclosing the 18T pinion and 66T m0.6 spur (center distance 25.2 mm; the motor slides 0.3 mm along its mesh
      slots from the 17T position). Internal reduction 2.4727:1, so 66/18 x 2.4727 = 9.066. Outputs are 6 mm D-bores
      on the outer faces (right output through the motor plate). The spur shaft is extended 8 mm through the gear
      cover for the encoder magnet carrier (senses the differential carrier at 2.4727 x carrier speed).
    mechanical:
      shape: custom
      size: [95 mm, 75 mm, 60 mm]
      mass: 0.12
      material: Glass-filled nylon case, steel gears
      color: "#4a4f57"
      moving: true
      solids:
        - {kind: box, name: case, position: [2.5 mm, -0.25 mm, 30 mm], size: [55 mm, 60.5 mm, 60 mm]}
        - {kind: box, name: motor plate, position: [22.5 mm, -31.5 mm, 23 mm], size: [95 mm, 3 mm, 46 mm]}
        - {kind: cylinder, name: spur cover, position: [29.93 mm, -32.5 mm, 34 mm], axis: [0, -1, 0], diameter: 43 mm, length: 12.5 mm}
        - {kind: cylinder, name: pinion cover, position: [49.24 mm, -32.5 mm, 17.8 mm], axis: [0, -1, 0], diameter: 15 mm, length: 12.5 mm}
      features:
        - {id: motor_axis, kind: bore, position: [49.24 mm, -30 mm, 17.8 mm], axis: [0, -1, 0], diameter: 8 mm, depth: 14 mm}
        - {id: motor_face, kind: face, position: [49.24 mm, -30 mm, 17.8 mm], axis: [0, 1, 0]}
        - {id: motor_slot_a, kind: slot, position: [57.0348 mm, -30 mm, 27.5756 mm], axis: [0, -1, 0], diameter: 3.4 mm, depth: 3 mm,
           length: 3 mm, slot_dir: [-0.766, 0, 0.643]}
        - {id: motor_slot_b, kind: slot, position: [40.9652 mm, -30 mm, 8.4244 mm], axis: [0, -1, 0], diameter: 3.4 mm, depth: 3 mm,
           length: 3 mm, slot_dir: [-0.766, 0, 0.643]}
        - {id: output_left, kind: d_bore, position: [0, 30 mm, 27 mm], axis: [0, -1, 0], diameter: 6.02 mm, depth: 10 mm,
           flat_offset: 2.51 mm, flat_normal: [0, 0, 1]}
        - {id: output_right, kind: d_bore, position: [0, -33 mm, 27 mm], axis: [0, 1, 0], diameter: 6.02 mm, depth: 10 mm,
           flat_offset: 2.51 mm, flat_normal: [0, 0, 1]}
        - {id: mount_1, kind: tapped_hole, position: [-18 mm, -22 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: mount_2, kind: tapped_hole, position: [-18 mm, 22 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: mount_3, kind: tapped_hole, position: [18 mm, -22 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: mount_4, kind: tapped_hole, position: [18 mm, 22 mm, 0], axis: [0, 0, 1], depth: 8 mm, thread: shcs-m3}
        - {id: spur_output, kind: shaft, position: [29.93 mm, -45 mm, 34 mm], axis: [0, -1, 0], diameter: 5 mm, depth: 8 mm,
           provenance: {status: derived, source: "R3 build drawing: 5 mm h6 spur-shaft extension through the gear cover"}}
        - {id: encoder_a, kind: tapped_hole, position: [33.43 mm, -45 mm, 20 mm], axis: [0, 1, 0], depth: 10 mm, thread: shcs-m2,
           provenance: {status: derived, source: "R3 build drawing: drill and tap M2 x 10 in the gear cover for the encoder board"}}
        - {id: encoder_b, kind: tapped_hole, position: [26.43 mm, -45 mm, 20 mm], axis: [0, 1, 0], depth: 10 mm, thread: shcs-m2,
           provenance: {status: derived, source: "R3 build drawing: drill and tap M2 x 10 in the gear cover for the encoder board"}}
      provenance: {status: estimated, source: "Envelope of a 1/10 2WD transmission with motor plate and gear cover"}
