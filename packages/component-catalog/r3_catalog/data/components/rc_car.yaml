        - {id: horn_screw, kind: tapped_hole, position: [0, 10 mm, 45.5 mm], axis: [0, 0, -1], depth: 8 mm, thread: shcs-m3}
        - {id: ear_1, kind: clearance_hole, position: [5 mm, 24.75 mm, 29 mm], axis: [0, 0, -1], diameter: 3.6 mm, depth: 2.5 mm}
        - {id: ear_2, kind: clearance_hole, position: [-5 mm, 24.75 mm, 29 mm], axis: [0, 0, -1], diameter: 3.6 mm, depth: 2.5 mm}
        - {id: ear_3, kind: clearance_hole, position: [5 mm, -24.75 mm, 29 mm], axis: [0, 0, -1], diameter: 3.6 mm, depth: 2.5 mm}
        - {id: ear_4, kind: clearance_hole, position: [-5 mm, -24.75 mm, 29 mm], axis: [0, 0, -1], diameter: 3.6 mm, depth: 2.5 mm}
      provenance: {status: datasheet, source: "DS3218 datasheet: 40 x 20 x 40.5 mm body, 49.5 x 10 mm ear hole pattern; ear height estimated"}
    pins:
      SIG: {role: pwm_in, logic_level: 2.0, voltage_max: 7.2}
      VCC: {role: power_in, voltage_nominal: 6.0, voltage_min: 4.8, voltage_max: 6.8, current_max: 3.0}
      GND: {role: ground}
    connectors:
      J1: {type: integral, position: [0, -20 mm, 10 mm], direction: [0, -1, 0], pins: {"1": SIG, "2": VCC, "3": GND}}
    behavior:
