      provenance: {status: datasheet, source: "Raspberry Pi Ltd official Raspberry Pi 5 3D STEP (RP-010083-CA-1, no graphics), product information portal pip.raspberrypi.com", notes: "STEP origin at the PCB bottom-left corner; its PCB is 1.31 mm thick (catalog solids assume 1.6 mm, see .r3-agents/requests/connectors.md)"}
