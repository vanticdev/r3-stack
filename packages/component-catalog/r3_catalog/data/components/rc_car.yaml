        x: [1, 0, 0]
        embedded: true
        source: "step: official Raspberry Pi 5 STEP, pin 1 post at (8.37, 51.23) mm, insulator 1.34-3.88 mm above the PCB bottom"
        pins: {"1": 3V3, "2": 5V, "3": GPIO2, "4": 5V, "5": GPIO3, "6": GND, "7": GPIO4, "8": GPIO14, "9": GND, "10": GPIO15,
               "11": GPIO17, "12": GPIO18, "13": GPIO27, "14": GND, "17": 3V3, "20": GND, "25": GND, "29": GPIO5, "30": GND,
