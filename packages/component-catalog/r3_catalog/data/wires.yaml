# Stranded copper, silicone insulation (typical hobby/robotics wire).
# Conductor diameter and resistance follow the AWG standard (ASTM B258 solid
# equivalent; stranded adds ~2-3 %, not modeled). Ampacity values are
# conservative free-air chassis-wiring estimates for 150 C silicone at 25 C
# ambient with ~30 C rise; they are NOT bundled/enclosed ratings.
