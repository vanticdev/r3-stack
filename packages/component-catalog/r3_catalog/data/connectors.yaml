    awg_min: 14
    awg_max: 20
    mating_cycles: 1000
    body_size: [10.2 mm, 5.2 mm, 10.6 mm]
    provenance: {status: datasheet, source: "Amass XT30 datasheet: 15 A continuous, 30 A burst"}
