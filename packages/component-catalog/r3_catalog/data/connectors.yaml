# Connector types. Ratings are continuous per contact at 25 C ambient.
# Cable-side and board-side halves are separate types linked by mates_with.
# Exact geometry (pin maps, mating face, wire entries, 3D model) per type is in
# connector_geometry.yaml, generated by `python -m r3_connectors.derive --write`.
# body_size is [across pins, across rows, along the mating axis].
connectors:
  - id: xt90h-male
    family: Amass XT90H
    gender: male
    mates_with: [xt90h-female]
    pin_count: 2
    current_rating_per_pin: 45
    voltage_rating: 500
    contact_resistance: 0.30 mohm
    awg_min: 10
    awg_max: 12
    mating_cycles: 1000
    body_size: [20.8 mm, 11.7 mm, 30.7 mm]
    provenance: {status: datasheet, source: "AMASS XT90H V1.2: 45 A rated / 90 A momentary, 0.30 mOhm; https://www.electrokit.com/upload/product/41020/41020964/XT90H.pdf", notes: "10 AWG recommended; 12 AWG solder termination retained at the existing lead. Body envelope includes insulating cap."}
