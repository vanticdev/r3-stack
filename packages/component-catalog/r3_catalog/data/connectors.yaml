# Connector types. Ratings are continuous per contact at 25 C ambient.
# Cable-side and board-side halves are separate types linked by mates_with.
# Exact geometry (pin maps, mating face, wire entries, 3D model) per type is in
# connector_geometry.yaml, generated by `python -m r3_connectors.derive --write`.
# body_size is [across pins, across rows, along the mating axis].
connectors:
  - id: xt60-male
    family: Amass XT60
    gender: male
    mates_with: [xt60-female]
    pin_count: 2
    current_rating_per_pin: 30
    voltage_rating: 500
    contact_resistance: 0.8 mohm
    awg_min: 10
    awg_max: 14
    mating_cycles: 1000
    body_size: [16 mm, 8.2 mm, 15.5 mm]
    provenance: {status: datasheet, source: "Amass XT60 datasheet: 30 A continuous, 60 A burst, <=0.8 mOhm"}
  - id: xt60-female
    family: Amass XT60
    gender: female
    mates_with: [xt60-male]
    pin_count: 2
    current_rating_per_pin: 30
    voltage_rating: 500
    contact_resistance: 0.8 mohm
    awg_min: 10
    awg_max: 14
    mating_cycles: 1000
    body_size: [16 mm, 8.2 mm, 15.5 mm]
    provenance: {status: datasheet, source: "Amass XT60 datasheet"}
  - id: xt30-male
