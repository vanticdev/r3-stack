# FDM filament materials for printed parts (r3_fab). Values are copied from the
# manufacturer technical data sheets (TDS) cited in each entry's provenance:
# printed ISO 527 / GB/T 1040 test bars at 100 % infill, X-Y = in-layer, Z =
# across layers. Strengths and moduli in Pa, HDT at 0.45 MPa in deg C.
#
# Estimated values are listed in each entry's provenance notes with the reason.
# Every entry estimates poisson_ratio: no TDS publishes it. 0.35 is the usual
# value for glassy thermoplastics (range about 0.33-0.40). Linear-elastic stresses
# in r3_fab's statically loaded parts are insensitive to it.
#
# Compare strengths only within one manufacturer. Bambu (ISO 527) and eSUN
# (GB/T 1040) bars differ in geometry and conditioning, so eSUN PLA+ 70 MPa does
# not mean PLA+ is twice as strong as Bambu PLA Basic at 35 MPa. TDS values are
# upper bounds for real parts with infill below 100 %.
materials:
  - id: petg
    name: PETG (Bambu Lab PETG HF)
    process: fdm
    keywords: [petg]
    density: 1.28 g/cm3                  # ISO 1183
    tensile_strength: 34.0e6             # X-Y 34 +/- 4 MPa
    tensile_strength_z: 23.0e6           # Z 23 +/- 4 MPa (Z/XY = 0.68)
    youngs_modulus: 1.81e9               # X-Y 1810 +/- 190 MPa (Z 1540 MPa)
    poisson_ratio: 0.35                  # estimated (see header)
    elongation_at_break: 0.086           # X-Y 8.6 % (Z 5.1 %)
    hdt: 69                              # ISO 75 at 0.45 MPa (62 deg C at 1.8 MPa)
    nozzle_temp_c: [230, 260]
    bed_temp_c: [65, 75]
    enclosure: false
    drying: "65 deg C for 8 h in a blast drying oven (X1 heatbed: 75-85 deg C for 12 h); print and store below 20 % RH"
    color: "#2c6e9e"
    notes: "Tg 66 deg C, Vicat 70 deg C. Chamber 35-50 deg C. Max overhang ~70 deg and bridge ~30 mm per the TDS."
    provenance:
      status: datasheet
      source: "Bambu Lab PETG HF TDS V1.0 https://store.bblcdn.com/3a230e260a3a47c2b0db0156e07eef91.pdf"
      notes: >-
        Estimated: poisson_ratio. Cross-check: Prusament PETG TDS v1.1 gives a horizontal tensile yield of 47 MPa
        and an interlayer adhesion of 18 +/- 4 MPa (https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2023/10/9f8d2165-tds_prusament-petg_n_en.pdf).
  - id: pla-plus
    name: PLA+ (eSUN PLA+)
    process: fdm
    keywords: [pla+, pla plus, pla-plus]
    density: 1.24 g/cm3                  # GB/T 1033
    tensile_strength: 70.37e6            # X-Y, GB/T 1040
    tensile_strength_z: 36.36e6          # Z (Z/XY = 0.52)
    youngs_modulus: 3.26e9               # ESTIMATED: flexural modulus X-Y 3259 MPa (GB/T 9341); tensile modulus not published
    poisson_ratio: 0.35                  # estimated (see header)
    elongation_at_break: 0.0414          # X-Y 4.14 % (Z 2.92 %)
    hdt: 53.78                           # GB/T 1634 at 0.45 MPa
    nozzle_temp_c: [210, 230]
    bed_temp_c: [45, 60]
    enclosure: false
    drying: "50 deg C for 8-12 h"
    color: "#d0d0d0"
    notes: "Not UV resistant (TDS). Older retail listings of eSUN PLA+ quote other numbers; this entry uses the TDS."
    provenance:
      status: datasheet
      source: "eSUN PLA+ TDS (Feb. 2026, Version 1.0) https://www.esun3d.com/media/esun/catalog/certification/product/PLA_3KG1.75MM/PLA_-TDS-en.pdf"
      notes: >-
        Estimated: youngs_modulus (eSUN publishes no tensile modulus; the X-Y flexural modulus 3259 MPa stands in for
        it, an approximation for unfilled PLA) and poisson_ratio.
  - id: pla
    name: PLA (Bambu Lab PLA Basic)
    process: fdm
    keywords: [pla, pla basic]
    density: 1.24 g/cm3                  # ISO 1183
    tensile_strength: 35.0e6             # X-Y 35 +/- 4 MPa
    tensile_strength_z: 31.0e6           # Z 31 +/- 3 MPa (Z/XY = 0.89)
    youngs_modulus: 2.58e9               # X-Y 2580 +/- 220 MPa (Z 2060 MPa)
    poisson_ratio: 0.35                  # estimated (see header)
    elongation_at_break: 0.122           # X-Y 12.2 % (Z 7.5 %)
    hdt: 57                              # ISO 75 at 0.45 MPa (54 deg C at 1.8 MPa)
    nozzle_temp_c: [190, 230]
    bed_temp_c: [35, 45]
    enclosure: false
    drying: "50 deg C for 8 h in a blast drying oven (X1 heatbed: 60-70 deg C for 12 h); store below 20 % RH"
    color: "#e0e0e0"
    notes: "Tg 60 deg C, Vicat 57 deg C. Print with the door open or a low chamber temperature (25-45 deg C). Max overhang 55 deg per the TDS."
    provenance:
      status: datasheet
      source: "Bambu Lab PLA Basic TDS V3.0 https://store.bblcdn.com/s1/default/58b85d0f3db94878854a28fdb8a0006e/Bambu_PLA_Basic_Technical_Data_Sheet.pdf"
      notes: "Estimated: poisson_ratio."
  - id: asa
    name: ASA (Bambu Lab ASA)
    process: fdm
    keywords: [asa]
    density: 1.05 g/cm3                  # ISO 1183
    tensile_strength: 37.0e6             # X-Y 37 +/- 3 MPa
    tensile_strength_z: 31.0e6           # Z 31 +/- 4 MPa (Z/XY = 0.84)
    youngs_modulus: 2.45e9               # X-Y 2450 +/- 270 MPa (Z 2120 MPa)
    poisson_ratio: 0.35                  # estimated (see header)
    elongation_at_break: 0.092           # X-Y 9.2 % (Z 4.6 %)
    hdt: 100                             # ISO 75 at 0.45 MPa (92 deg C at 1.8 MPa)
    nozzle_temp_c: [240, 270]
    bed_temp_c: [80, 100]
    enclosure: true                      # Bambu: same warping tendency and enclosure requirement as ABS for large / dense parts
    drying: "80 deg C for 8 h in a blast drying oven (X1 heatbed: 90-100 deg C for 12 h); store below 20 % RH"
    color: "#3a3a3a"
    notes: "UV and weather resistant. Vicat 106 deg C. Chamber 45-60 deg C. Bambu lists ASA as not recommended on the A1 mini."
    provenance:
      status: datasheet
      source: "Bambu Lab ASA TDS V3.0 https://store.bblcdn.com/ad7b08230c164e72856cffbe06bb7dc9.pdf"
      notes: >-
        Estimated: poisson_ratio. Cross-check: Prusament ASA TDS v1.1 gives a horizontal yield of 42 MPa and an
        interlayer adhesion of 11 +/- 1 MPa (https://storage.googleapis.com/prusa3d-content-prod-14e8-wordpress-prusament-prod/2024/05/bc8551ef-tds_prusament-asa_2024_en.pdf).
  - id: pa6-cf
    name: PA6-CF (Bambu Lab PA6-CF)
    process: fdm
    keywords: [pa6-cf, pa-cf, pa6 cf, nylon-cf, cf nylon]
    density: 1.09 g/cm3                  # ISO 1183
    tensile_strength: 102.0e6            # X-Y 102 +/- 7 MPa, dry
    tensile_strength_z: 48.0e6           # Z 48 +/- 6 MPa (Z/XY = 0.47)
    youngs_modulus: 4.43e9               # X-Y 4430 +/- 310 MPa (Z 2170 MPa)
    poisson_ratio: 0.35                  # estimated (see header); fibre-filled and anisotropic
    elongation_at_break: 0.058           # X-Y 5.8 % (Z 3.7 %)
    hdt: 186                             # ISO 75 at 0.45 MPa (164 deg C at 1.8 MPa)
    nozzle_temp_c: [260, 290]
    bed_temp_c: [80, 100]
    enclosure: true
    drying: "80 deg C for 8-12 h in a blast drying oven (X1 heatbed: 90-100 deg C for 12 h); hygroscopic, saturated water absorption 2.35 %"
    color: "#2b2b2b"
    notes: >-
      Hardened-steel nozzle required (Bambu). Values are dry state; wet-state values are not published, so expect lower
      strength and stiffness once conditioned. Chamber 45-60 deg C. 0.6 mm nozzle recommended.
    provenance:
      status: datasheet
      source: "Bambu Lab PA6-CF TDS V3.0 https://store.bblcdn.com/b2abc59ac250492b979a52f1ce3e61b3.pdf"
      notes: "Estimated: poisson_ratio (an isotropic E/nu model is itself an approximation for this anisotropic composite)."
  - id: paht-cf
    name: PAHT-CF (Bambu Lab PAHT-CF, PA12-based)
    process: fdm
    keywords: [paht-cf, pa12-cf, paht cf, pa12 cf]
    density: 1.06 g/cm3                  # ISO 1183 (as published; weigh a part before relying on it for mass)
    tensile_strength: 92.0e6             # X-Y 92 +/- 7 MPa, dry
    tensile_strength_z: 47.0e6           # Z 47 +/- 5 MPa (Z/XY = 0.51)
    youngs_modulus: 3.86e9               # X-Y 3860 +/- 230 MPa (Z 2180 MPa)
    poisson_ratio: 0.35                  # estimated (see header); fibre-filled and anisotropic
    elongation_at_break: 0.084           # X-Y 8.4 % (Z 4.1 %)
    hdt: 194                             # ISO 75 at 0.45 MPa (170 deg C at 1.8 MPa)
    nozzle_temp_c: [260, 290]
    bed_temp_c: [80, 100]
    enclosure: true                      # "unsuitable for use with open-frame printers" (Bambu store page)
    drying: "80 deg C for 8-12 h in a blast drying oven (X1 heatbed: 90-100 deg C for 12 h); saturated water absorption 0.88 %"
    color: "#2b2b2b"
    notes: "Hardened-steel nozzle required. Composition: PA12 and other long-chain PA with carbon fibre. Dry-state values."
    provenance:
      status: datasheet
      source: "Bambu Lab PAHT-CF TDS V3.0 https://store.bblcdn.com/7166b20bc68f4c87b32c972b856eeb4b.pdf"
      notes: "Estimated: poisson_ratio."
