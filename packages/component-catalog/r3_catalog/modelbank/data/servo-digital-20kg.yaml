    2 (output) or 5 (horn). Radius-2.25 cylindrical slot walls 1034/1040 have axes X=24.75, Z=+5/-5; 902/898
    have X=-24.75, Z=+5/-5, all parallel to +Y. Top ear planes 1025/888 have outward normals (+/-0.022033876799,0.999757224667,0),
    so their normals are drafted, not the bolt axis. Intersecting each cylinder axis with its own top
    plane gives source Y=10.793155398332 (a) / 10.793155398329 (b); adding placement Y=20 gives the four
    recorded hole-seat origins. Frame Z is the measured cylinder/bolt axis +Y, not the tilted face normal;
    frame X follows the pair of slot centres along +Z. Underside planes 881/893 intersect those axes at
    Y=7.643739490228, giving 3.149415908104 mm ear thickness along the bolt. The slots are open-sided
    cylindrical seats, not complete round bores. All four far-seat frames agree with the catalog to numerical
    precision and retain the real draft; no geometry was sculpted or flattened. Verify ear height on receipt.
    DS3218MG community geometry is a different label and is not used.
