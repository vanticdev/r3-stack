# r3-platform CI: build the R3 worker image (docker/r3-worker), run the test
# suite and a headless pipeline smoke test inside it, and publish the image to
# GHCR from main and tags. Project repositories created by `r3 create` run
# their r3.yml workflow in the published image (tag = platform revision).
name: r3-platform

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r3-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: r3-worker

jobs:
  test:
    name: pytest in the worker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64  # firmware containers are linux/arm64 (Pi OS userspace)

      - uses: docker/setup-buildx-action@v3

      - name: Build worker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/r3-worker/Dockerfile
          platforms: linux/amd64
          tags: r3-worker:ci
          load: true
          cache-from: type=gha,scope=r3-worker-amd64
          cache-to: type=gha,mode=max,scope=r3-worker-amd64

      - name: r3 doctor
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock r3-worker:ci \
            r3 doctor --require model,pcb,wiring,electrical,sim,software

      - name: pytest
        # The checkout is mounted over the image's editable install, so the
        # tests exercise this revision. The Docker socket lets the firmware
        # container tests run their linux/arm64 image on the runner's daemon.
        run: |
          docker run --rm \
            -v "$PWD":/opt/r3/platform -w /opt/r3/platform \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e CI=true \
            r3-worker:ci python -m pytest tests -q -rs

      - name: Headless pipeline smoke test (rc-car)
        run: |
          mkdir -p smoke
          docker run --rm -v "$PWD":/opt/r3/platform -v "$PWD/smoke":/smoke r3-worker:ci bash -euc '
            cp -r /opt/r3/platform/examples/robots/rc-car /smoke/rc-car
            cd /smoke/rc-car
            r3 validate --stage model --json > /smoke/validate-model.json || true
            r3 sim run --scenario steering_sweep --json > /smoke/sim-steering_sweep.json || true
            ls -R build | head -50'

      - name: Upload smoke-test build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-platform-smoke-${{ github.sha }}
          path: smoke/
          if-no-files-found: warn

  publish:
    name: publish worker image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # The full commit SHA is the tag `r3 create` pins projects to.
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/r3-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=r3-worker-amd64
            type=gha,scope=r3-worker-multi
          cache-to: type=gha,mode=max,scope=r3-worker-multi
