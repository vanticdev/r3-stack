schema: r3/robot@1
# Lane D fixture: a printed PETG chassis carrying the bought Traxxas Slash 2WD driveline (Magnum 272, Titan 12T,
# half-shafts in printed bearing webs, SCT wheels), a Raspberry Pi 5 fed by a Pololu D36V50F5 and a QuicRun WP 1060.
# No steering, radio or sensors: it validates that the off-the-shelf catalog assembles and drives in the twin.
robot: {name: printcar, description: Printed-frame drive test car with the off-the-shelf Traxxas driveline, version: 0.1.0}
components:
  chassis: {type: printcar-chassis-petg, pose: {xyz: [0, 0, 0.02]}}
  gearbox: {type: traxxas-3695-magnum-272}
  motor: {type: traxxas-3785-titan-12t-550}
  halfshaft_l: {type: traxxas-rear-halfshaft-l}
  halfshaft_r: {type: traxxas-rear-halfshaft-r}
  bearing_l: {type: traxxas-5116-bearing-5x11x4}
  bearing_r: {type: traxxas-5116-bearing-5x11x4}
  wheel_rl: {type: traxxas-5878-sct-wheel-rear}
  wheel_rr: {type: traxxas-5878-sct-wheel-rear}
  nut_rl: {type: traxxas-1747-nut-m4-nyloc}
  nut_rr: {type: traxxas-1747-nut-m4-nyloc}
  axle_fl: {type: traxxas-front-axle-5mm}
  axle_fr: {type: traxxas-front-axle-5mm}
  wheel_fl: {type: traxxas-5879-sct-wheel-front}
  wheel_fr: {type: traxxas-5879-sct-wheel-front}
  nut_fl: {type: traxxas-1747-nut-m4-nyloc}
  nut_fr: {type: traxxas-1747-nut-m4-nyloc}
  pi: {type: raspberry-pi-5-4gb}
  battery: {type: gensace-5000-2s-60c-xt60}
  esc: {type: hobbywing-quicrun-wp-1060}
  bec: {type: pololu-d36v50f5}
assembly:
  root: chassis
  joins:
    - {id: gb_mount, a: chassis.gearbox, b: gearbox.mount, clock: 0 deg, fasteners: {type: M3x10}}
    - {id: motor_mount, a: gearbox.motor_mount, b: motor.face, clock: 0 deg, fasteners: {type: M3x6}}
    - {id: motor_pinion, a: gearbox.pinion, b: motor.shaft, kind: drive_flat}
    - {id: output_l, a: gearbox.output_l, b: halfshaft_l.output, kind: revolute, joint: spin_rl, damping: 0.0005,
       verify: {kind: drive_flat, rotating_bore: true}}
    - {id: output_r, a: gearbox.output_r, b: halfshaft_r.output, kind: revolute, joint: spin_rr, damping: 0.0005,
       verify: {kind: drive_flat, rotating_bore: true}}
    - {id: bearing_seat_l, a: chassis.bearing_l, b: bearing_l.outer, fit: interference}
    - {id: bearing_seat_r, a: chassis.bearing_r, b: bearing_r.outer, fit: interference}
    - {id: bearing_shaft_l, a: bearing_l.inner, b: halfshaft_l.bearing_seat, kind: revolute}
    - {id: bearing_shaft_r, a: bearing_r.inner, b: halfshaft_r.bearing_seat, kind: revolute}
    - {id: wheel_drive_rl, a: halfshaft_l.hex, b: wheel_rl.hub, kind: drive_flat}
    - {id: wheel_drive_rr, a: halfshaft_r.hex, b: wheel_rr.hub, kind: drive_flat}
    - {id: wheel_nut_rl, a: halfshaft_l.nut_thread, b: nut_rl.seat, fasteners: {type: M4x8, clamps: [wheel_rl]}}
    - {id: wheel_nut_rr, a: halfshaft_r.nut_thread, b: nut_rr.seat, fasteners: {type: M4x8, clamps: [wheel_rr]}}
    - {id: axle_press_fl, a: chassis.axle_fl, b: axle_fl.press, fit: interference}
    - {id: axle_press_fr, a: chassis.axle_fr, b: axle_fr.press, fit: interference}
    - {id: hub_fl, a: axle_fl.journal, b: wheel_fl.hub, kind: revolute, joint: spin_fl, damping: 0.0005}
    - {id: hub_fr, a: axle_fr.journal, b: wheel_fr.hub, kind: revolute, joint: spin_fr, damping: 0.0005}
    - {id: wheel_nut_fl, a: axle_fl.nut_thread, b: nut_fl.seat, fasteners: {type: M4x8, preloaded: false}}
    - {id: wheel_nut_fr, a: axle_fr.nut_thread, b: nut_fr.seat, fasteners: {type: M4x8, preloaded: false}}
    - {a: chassis.pi_1, b: pi.h1, fasteners: {type: M2.5x6}}
    - {a: chassis.pi_2, b: pi.h2, fasteners: {type: M2.5x6}}
    - {a: chassis.pi_3, b: pi.h3, fasteners: {type: M2.5x6}}
    - {a: chassis.pi_4, b: pi.h4, fasteners: {type: M2.5x6}}
    - {a: chassis.battery_seat, b: battery.bottom}
    - {a: chassis.esc_pad, b: esc.bottom}
    - {a: chassis.bec_pad, b: bec.bottom}
mechanical:
  transmissions:
    - {id: drive, type: differential, actuator: motor, joints: [spin_rl, spin_rr], ratio: 10.17, efficiency: 0.85}
electrical:
  harnesses:
    - id: battery_lead
      description: Battery 12 AWG pigtail with XT60 female.
      connectors:
        A: {type: integral, mates: battery.J1}
        B: {type: xt60-female}
      wires:
        - {id: W_BAT_P, from: A.1, to: B.1, awg: 12, color: red, signal: VBAT}
        - {id: W_BAT_N, from: A.2, to: B.2, awg: 12, color: black, signal: GND}
    - id: power
      description: XT60 male to the ESC (12 AWG, re-terminated QuicRun leads) and the Pololu buck (18 AWG).
      connectors:
        P: {type: xt60-male, mates: battery_lead.B}
        E: {type: integral, mates: esc.J_PWR}
        R: {type: integral, mates: bec.J_IN}
      splices:
        SP: {position: [140 mm, 0, 60 mm]}
        SN: {position: [140 mm, -10 mm, 60 mm]}
      wires:
        - {id: W_P_IN, from: P.1, to: SP, awg: 12, color: red, signal: VBAT}
        - {id: W_P_ESC, from: SP, to: E.1, awg: 12, color: red, signal: VBAT}
        - {id: W_P_BEC, from: SP, to: R.1, awg: 18, color: red, signal: VBAT}
        - {id: W_N_IN, from: P.2, to: SN, awg: 12, color: black, signal: GND}
        - {id: W_N_ESC, from: SN, to: E.2, awg: 12, color: black, signal: GND}
        - {id: W_N_BEC, from: SN, to: R.2, awg: 18, color: black, signal: GND}
    - id: motor_leads
      connectors:
        A: {type: integral, mates: esc.J_MOT}
        B: {type: integral, mates: motor.J_POS}
        C: {type: integral, mates: motor.J_NEG}
      wires:
        - {id: W_M_A, from: A.1, to: B.1, awg: 14, color: blue, signal: MOTOR_A}
        - {id: W_M_B, from: A.2, to: C.1, awg: 14, color: yellow, signal: MOTOR_B}
    - id: pi_io
      description: Pololu 5 V to J8 pins 2/6, ESC signal on GPIO18 (pin 12) with its ground on pin 14.
      connectors:
        J: {type: socket-2x20-2.54, mates: pi.J8}
        R: {type: integral, mates: bec.J_OUT}
        S: {type: integral, mates: esc.J_SIG}
      wires:
        - {id: W_PI_5V, from: R.1, to: J.2, awg: 22, color: red, signal: 5V}
        - {id: W_PI_GND, from: R.2, to: J.6, awg: 22, color: black, signal: GND}
        - {id: W_ESC_SIG, from: S.1, to: J.12, awg: 24, color: white, signal: ESC_PWM}
        - {id: W_ESC_GND, from: S.3, to: J.14, awg: 24, color: black, signal: GND}
software:
  modules:
    - {name: drive, language: python, runs_on: pi, entrypoint: main.py}
  bindings:
    esc_pwm: {interface: pwm, computer: pi, pins: [pi.J8.12], device: pwmchip0, channel: 2, frequency: 50 Hz, expects: [esc.J_SIG.1]}
  config: {throttle_us: 1650, run_s: 4.0}
simulation:
  environment: {ground_friction: 0.9, visual: {ground: grass, track: {points: [[0, 0], [30, 0]], closed: false}}}
  scenarios:
    - id: straight
      description: Open-loop throttle for 4 s, then neutral.
      duration: 7 s
      initial: {battery_soc: 0.9, mode: manual}
      expect: {min_top_speed_mps: 2.0, brownouts: 0}
