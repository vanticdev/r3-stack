<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>R3</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f97316'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-weight='800' font-size='15' text-anchor='middle' fill='white'%3ER3%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint (no flash).
      try {
        const theme = localStorage.getItem("r3.theme");
        document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
